<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141415">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<title>ASMR 라이브러리</title>
<style>
@font-face{font-family:"Pretendard";font-weight:400;src:url(/static/fonts/Pretendard-Regular.subset.woff2) format("woff2");font-display:swap}@font-face{font-family:"Pretendard";font-weight:500;src:url(/static/fonts/Pretendard-Medium.subset.woff2) format("woff2");font-display:swap}@font-face{font-family:"Pretendard";font-weight:600;src:url(/static/fonts/Pretendard-SemiBold.subset.woff2) format("woff2");font-display:swap}

:root {
  /* 기본(다크) — data-theme 없을 때 */
  --bg: #141415; --bg2: #1b1b1d; --bg3: #242426;
  --fg: #ededed; --fg-dim: #a1a1a6;
  --accent: #e29ab0; --accent2: var(--fg);
  --line: rgba(237,237,237,.08); --line2: rgba(237,237,237,.06); --card-line: rgba(237,237,237,.08);
  --dim2: #85858b; --dim3: #85858b;
  --head-bg: rgba(20,20,21,.92); --sheet-bg: rgba(14,14,15,.97);
  --ph1: var(--bg3); --ph2: var(--bg3);
  --ease: cubic-bezier(0.22,1,0.36,1);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="black"] {
  /* OLED — 완전한 검정. 면은 칠하지 않고 테두리로만 구분한다 */
  --bg: #000; --bg2: #000; --bg3: #000;
  --fg: #ededed; --fg-dim: #a1a1a6;
  --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.06); --card-line: rgba(255,255,255,.08);
  --dim2: #85858b; --dim3: #85858b;
  --head-bg: rgba(0,0,0,.92); --sheet-bg: rgba(0,0,0,.98);
  --ph1: #101013; --ph2: #1c1c21;
}
:root[data-theme="light"] {
  --bg: #fafaf9; --bg2: #ffffff; --bg3: #f0f0ee;
  --fg: #1a1a1b; --fg-dim: #5f5f64; --accent: #b4506d;
  --line: rgba(26,26,27,.09); --line2: rgba(26,26,27,.06); --card-line: rgba(26,26,27,.09);
  --dim2: #8a8a8f; --dim3: #8a8a8f;
  --head-bg: rgba(247,247,250,.92); --sheet-bg: rgba(255,255,255,.98);
  --ph1: var(--bg3); --ph2: var(--bg3);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  overscroll-behavior-y: none; -webkit-font-smoothing: antialiased;
}
svg.i { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor;
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
svg.i.f { fill: currentColor; }
button:has(> svg.i) { display: inline-flex; align-items: center; justify-content: center; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--fg-dim); outline-offset: 2px; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }

/* ── 헤더 ── */
#header {
  position: sticky; top: 0; z-index: 20;
  background: var(--head-bg); backdrop-filter: blur(10px);
  padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 12px;
}
#header .row { display: flex; align-items: center; gap: 4px; }
#header h1 { font-size: 18px; font-weight: 600; margin: 0; flex: 1; }
#header .sub { justify-content: space-between; margin-top: -4px; }
#count { font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
#sort {
  background: none; color: var(--fg-dim); border: none;
  font-size: 12px; padding: 4px 0; outline: none; text-align: right;
}
#favbtn, #setbtn { color: var(--fg-dim); width: 36px; height: 36px; }
#favbtn.on { color: var(--accent); }
#favbtn.on svg { fill: currentColor; }
#setbtn.on { color: var(--fg); }

/* ── 이어 듣기 카드 ── */
#resume { padding: 4px 16px 0; }
#resume:empty { display: none; }
#resume-card {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  background: var(--bg2); border: 1px solid var(--card-line); border-radius: 12px; padding: 8px 12px 8px 8px;
}
#resume-card:active { transform: scale(.98); }
#resume-card img, #resume-card .cover-ph {
  width: 44px; height: 44px; border-radius: 6px; object-fit: cover; font-size: 11px; flex-shrink: 0;
}
#resume-card .rt { flex: 1; min-width: 0; }
#resume-card .rt .a { font-size: 12px; color: var(--fg-dim); }
#resume-card .rt .b { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
#resume-card .tm { font-size: 12px; color: var(--fg-dim); flex-shrink: 0; font-variant-numeric: tabular-nums; }

/* ── 카드 진행률·즐겨찾기 표시 ── */
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(0,0,0,.4); }
.prog div { height: 100%; background: var(--accent); }
.fav-mark { position: absolute; right: 8px; top: 8px; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.fav-mark svg.i { width: 14px; height: 14px; }
#search {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg2); color: var(--fg); font-size: 15px; outline: none;
}
#search:focus { border-color: var(--fg-dim); }
#search::placeholder { color: var(--dim3); }

/* ── 라이브러리 그리드 ── */
#library {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 20px 12px; padding: 16px 16px calc(140px + var(--safe-b));
}
.card { cursor: pointer; transition: transform 140ms var(--ease); }
.card:active { transform: scale(.98); }
.cover-box { aspect-ratio: 4/3; background: var(--bg3); position: relative; overflow: hidden; border-radius: 10px; outline: 1px solid var(--line); outline-offset: -1px; }
.cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-ph {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 500; color: var(--dim3); font-variant-numeric: tabular-nums;
  background: linear-gradient(135deg, var(--ph1), var(--ph2));
}
.badge {
  position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 500; line-height: 16px;
  background: rgba(0,0,0,.55); color: rgba(255,255,255,.85); padding: 2px 6px; border-radius: 6px;
  font-variant-numeric: tabular-nums; backdrop-filter: blur(6px);
}
.card .info { padding: 8px 2px 0; }
.card .t {
  font-size: 14px; font-weight: 500; line-height: 1.4; max-height: 2.8em; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.card .c { font-size: 12px; color: var(--fg-dim); margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#empty { grid-column: 1/-1; text-align: center; color: var(--fg-dim); padding: 60px 20px; font-size: 14px; line-height: 1.8; }
#empty code { background: var(--bg3); padding: 2px 6px; border-radius: 6px; font-size: 12px; }

/* ── 작품 상세 ── */
#detail {
  position: fixed; inset: 0; z-index: 30; background: var(--bg);
  transform: translateX(100%); transition: transform .32s var(--ease); overflow-y: auto;
  padding-bottom: calc(140px + var(--safe-b));
}
#detail.open { transform: translateX(0); }
#detail .hero { position: relative; }
#detail .hero img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
#detail .hero .cover-ph { aspect-ratio: 4/3; font-size: 44px; }
#detail .hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 55%, var(--bg));
}
#d-back, #d-fav {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 31;
  width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff;
  backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center;
}
#d-fav { left: auto; right: 12px; }
#d-fav.on { color: var(--accent); }
#d-tags span:active { opacity: .55; }
#d-body { padding: 0 16px; margin-top: -32px; position: relative; }
#d-title { font-size: 20px; font-weight: 600; line-height: 1.4; margin: 0 0 4px; }
#d-orig { font-size: 13px; color: var(--dim3); line-height: 1.4; margin: 0 0 8px; }
#d-orig:empty { display: none; }
#d-sub { font-size: 13px; color: var(--fg-dim); margin-bottom: 12px; font-variant-numeric: tabular-nums; }
#d-sub .rj { color: var(--fg-dim); }
#d-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
#d-tags span {
  font-size: 12px; padding: 4px 8px; border-radius: 6px;
  background: var(--bg3); color: var(--fg-dim);
}
#d-tags span.cv { color: var(--fg); }
#d-tags span.cv i { font-style: normal; color: var(--dim3); margin-right: 4px; }
#d-listhead {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 0 4px; font-size: 12px; color: var(--fg-dim);
}
#d-folders { font-size: 12px; font-weight: 500; color: var(--fg-dim); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
#d-folders.on { color: var(--fg); }
.folder-h {
  font-size: 12px; font-weight: 500; color: var(--fg-dim); display: flex; align-items: center; gap: 6px;
  padding: 20px 0 8px; border-bottom: 1px solid var(--line2);
}
.folder-h svg.i { width: 14px; height: 14px; color: var(--dim3);
}
/* ── 탐색 모드 ── */
#crumb {
  display: flex; align-items: center; gap: 8px; padding: 8px 0 4px;
  font-size: 12px; color: var(--fg-dim); word-break: break-all;
}
#exp-up { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 8px; flex-shrink: 0; color: var(--fg-dim); }
#exp-up:disabled { opacity: .3; }
.track.dir .n { color: var(--fg); font-weight: 500; }
.track .no svg.i { width: 16px; height: 16px; margin: 0 auto; color: var(--dim3); }
.track.other .n { color: var(--fg-dim); }
/* ── 이미지·텍스트 뷰어 ── */
#viewer {
  position: fixed; inset: 0; z-index: 70; background: var(--sheet-bg);
  display: none; flex-direction: column;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 14px calc(14px + var(--safe-b));
}
#viewer.open { display: flex; }
#v-close { align-self: flex-end; width: 40px; height: 40px; flex-shrink: 0; }
#v-body { flex: 1; overflow: auto; }
#v-body img { display: block; max-width: 100%; height: auto; margin: 0 auto; border-radius: 12px; }
#v-body pre { white-space: pre-wrap; word-break: break-word; font: 14px/1.7 inherit; margin: 0; color: var(--fg); }
.track {
  display: flex; align-items: center; gap: 12px; padding: 12px 0;
  border-bottom: 1px solid var(--line2); cursor: pointer;
}
.track:active { background: var(--bg2); }
.track .no { width: 24px; text-align: center; color: var(--dim3); font-size: 13px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.track.playing .no { color: var(--accent); }
.track .tn { flex: 1; min-width: 0; }
.track .tn .n { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track.playing .tn .n { color: var(--accent); font-weight: 500; }
.track.playing .no svg.i { color: var(--accent); }
.track .tn .f { font-size: 12px; color: var(--dim3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.track .cc {
  flex-shrink: 0; font-size: 11px; font-weight: 500; color: var(--dim3);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
}
.track .cc.ko { color: var(--fg-dim); }
.track .sz { flex-shrink: 0; font-size: 12px; color: var(--dim3); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

/* ── 미니 플레이어 ── */
#mini {
  position: fixed; left: 8px; right: 8px; bottom: calc(8px + var(--safe-b)); z-index: 40;
  background: var(--bg3); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.3);
  display: none; overflow: hidden;
}
#mini.on { display: block; }
#mini-bar { height: 2px; background: var(--line); }
#mini-bar div { height: 100%; width: 0; background: var(--accent); }
#mini .inner { display: flex; align-items: center; gap: 12px; padding: 8px 4px 8px 8px; }
#mini img, #mini .cover-ph { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex-shrink: 0; font-size: 11px; }
#mini .tt { flex: 1; min-width: 0; }
#mini .tt .n { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mini .tt .cue { font-size: 12px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; min-height: 13px; }
#mini button { width: 44px; height: 44px; flex-shrink: 0; }
#mini button svg.i { width: 22px; height: 22px; }

/* ── 전체 플레이어 ── */
#player {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  transform: translateY(100%); transition: transform .36s var(--ease);
  display: flex; flex-direction: column;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 20px calc(16px + var(--safe-b));
}
#player.open { transform: translateY(0); }
#p-top { display: flex; align-items: center; }
#p-close { width: 40px; height: 40px; color: var(--fg-dim); }
#p-close svg.i { width: 24px; height: 24px; }
#p-work { flex: 1; text-align: center; font-size: 13px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
#p-tr { width: 40px; height: 40px; color: var(--dim3); }
#p-tr.on { color: var(--fg-dim); }
#p-cover-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px 0; }
#p-cover-wrap img, #p-cover-wrap .cover-ph {
  max-width: 100%; max-height: 100%; aspect-ratio: 4/3; border-radius: 14px;
  object-fit: cover; outline: 1px solid var(--line); outline-offset: -1px; font-size: 15px;
}
#p-cue {
  min-height: 66px; max-height: 34vh; overflow-y: auto;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 8px 4px; line-height: 1.6; font-weight: 500;
  font-size: var(--cue-size, 18px); color: var(--cue-color, var(--fg));
}
#p-cue.none { color: var(--dim3); font-size: 13px; font-weight: 400; }
#p-cue { flex-direction: column; }
#p-cue .cline + .cline { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }

/* ── 보기 모드 (전체 / 표지+자막 / 자막만) ── */
.topbtn { font-size: 13px; font-weight: 500; width: 40px; height: 40px; color: var(--fg-dim); }
#player.mode-cover #p-title, #player.mode-cover #p-seek, #player.mode-cover #p-time, #player.mode-cover #p-ctrl,
#player.mode-sub #p-title, #player.mode-sub #p-seek, #player.mode-sub #p-time, #player.mode-sub #p-ctrl,
#player.mode-sub #p-cover-wrap { display: none; }
#player.mode-cover #p-cue, #player.mode-sub #p-cue { flex: 1; max-height: none; line-height: 1.7; }

/* ── 몰입 모드: 표지와 자막만 남기고 전부 숨김 ── */
body.immersive #header, body.immersive #mini, body.immersive #p-top,
body.immersive #p-title, body.immersive #p-ctrl { display: none; }
/* 재생바·시간은 건드리지 않는다 — mode-cover/mode-sub 규칙이 이미 숨기므로
   결과적으로 '전체' 모드에서만 남는다 (되살리는 예외 규칙이 필요 없음) */
/* 화면을 한 번 누르면 상단바만 잠깐 되살아난다 (몰입 해제용) */
body.immersive.chrome-peek #p-top { display: flex; }
body.immersive #p-cue { flex: 1; max-height: none; line-height: 1.7; }
#p-full.on { color: var(--fg); }

/* ── 트랙 자동 전환 알림 ── */
#toast {
  position: fixed; left: 50%; bottom: calc(100px + var(--safe-b)); z-index: 90;
  transform: translateX(-50%) translateY(10px);
  background: var(--bg3); color: var(--fg); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 16px; font-size: 13px; font-weight: 500;
  max-width: 78vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
  opacity: 0; pointer-events: none; transition: opacity .2s var(--ease), transform .2s var(--ease);
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 자막 설정 패널 ── */
#p-settings {
  /* body 직속 — 라이브러리 화면과 플레이어 양쪽에서 열린다 */
  position: fixed; top: calc(56px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 60;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px; width: 280px;
  box-shadow: 0 8px 24px rgba(0,0,0,.35); display: none;
}
#set-themes { display: flex; gap: 7px; margin-left: auto; }
#set-themes button {
  height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line);
  font-size: 11px; font-weight: 500; color: var(--fg-dim);
}
#set-themes button.sel { border-color: var(--fg-dim); color: var(--fg); }
#set-themes button[data-t="dark"]  { background: #141415; }
#set-themes button[data-t="black"] { background: #000; }
#set-themes button[data-t="light"] { background: #f7f7fa; color: #6b7280; }
.set-sep { height: 1px; background: var(--line); margin: 12px -16px 0; }
#p-settings.open { display: block; }
#p-settings { max-height: calc(100dvh - 76px - env(safe-area-inset-top, 0px)); overflow-y: auto; }
#fail {
  display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 95; color: #fff; background: #b91c1c;
  padding: calc(9px + env(safe-area-inset-top, 0px)) 14px 9px; box-shadow: 0 4px 18px rgba(0,0,0,.5);
}
#fail.on { display: block; }
#fail-head { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
#fail-n { flex: 1; }
#fail button { color: #fff; font-size: 12px; font-weight: 600; border: 1px solid #fff; border-radius: 99px; padding: 4px 11px; }
#fail-list { display: none; max-height: 45dvh; overflow-y: auto; margin-top: 8px; font-size: 12px; line-height: 1.45; }
#fail.open #fail-list { display: block; }
.fail-i { padding: 6px 0; border-top: 1px solid rgba(255,255,255,.3); overflow-wrap: anywhere; }
.fail-i b { display: block; }
.set-area { display: block; margin-top: 12px; font-size: 12px; color: var(--fg-dim); }
.set-area textarea {
  display: block; box-sizing: border-box; width: 100%; margin-top: 5px; padding: 7px 8px; resize: vertical;
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
.set-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-dim); white-space: nowrap; }
.set-row + .set-row { margin-top: 12px; }
#set-size { flex: 1; accent-color: var(--accent2); }
#set-size-v { width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; flex-shrink: 0; }
.swatch.sel { border-color: var(--bg2); box-shadow: 0 0 0 2px var(--fg-dim); }
#set-color { width: 28px; height: 28px; border: none; background: none; padding: 0; cursor: pointer; }
#p-title { font-size: 17px; font-weight: 600; margin-top: 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#p-seek { width: 100%; margin: 12px 0 4px; accent-color: var(--accent); height: 26px; }
#p-time { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
#p-ctrl { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
#p-ctrl button { width: 48px; height: 48px; color: var(--fg); }
#p-ctrl button svg.i { width: 24px; height: 24px; }
#p-ctrl .small { font-size: 13px; font-weight: 500; color: var(--dim3); font-variant-numeric: tabular-nums; }
#p-play {
  width: 64px !important; height: 64px !important;
  background: var(--fg); border-radius: 50%; color: var(--bg) !important;
  transition: transform 140ms var(--ease);
}
#p-play:active { transform: scale(.97); }
#p-play svg.i { width: 26px !important; height: 26px !important;
}

/* ── 자막 전체보기 ── */
#transcript {
  position: absolute; inset: 0; background: var(--bg); z-index: 5;
  display: none; flex-direction: column;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 0 calc(10px + var(--safe-b));
}
#transcript.open { display: flex; }
#tr-head { display: flex; align-items: center; padding: 0 14px 8px; }
#tr-head b { flex: 1; font-size: 16px; font-weight: 600; }
#tr-head button { width: 40px; height: 40px; color: var(--fg-dim); }
#tr-list { flex: 1; overflow-y: auto; padding: 0 18px; }
.cue-line { padding: 9px 10px; border-radius: 10px; font-size: 15px; line-height: 1.55; color: var(--fg-dim); cursor: pointer; }
.cue-line .ts { font-size: 11px; color: var(--dim3); margin-right: 8px; font-variant-numeric: tabular-nums; }
.cue-line.cur { background: var(--bg3); color: var(--cue-color, var(--fg)); }
/* 대사 사이: 방금 끝난 줄을 옅게 표시해 위치를 잃지 않게 */
.cue-line.prev { box-shadow: inset 3px 0 0 var(--accent); color: var(--fg); }
#tr-follow {
  position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%);
  display: none; padding: 9px 16px; border-radius: 999px; font-size: 13px;
  background: var(--fg); color: var(--bg); box-shadow: 0 4px 16px rgba(0,0,0,.35);
}
#tr-follow.show { display: block; }

.spin { text-align: center; color: var(--fg-dim); padding: 40px; grid-column: 1/-1; }

/* ── 가로 화면: 플레이어 좌우 분할, 상세 히어로 높이 제한 ── */
@media (orientation: landscape) {
  #detail .hero img, #detail .hero .cover-ph {
    aspect-ratio: auto; height: 44vh; width: 100%; object-fit: cover;
  }
  #player {
    display: grid;
    grid-template-columns: minmax(0, 42%) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto auto;
    grid-template-areas:
      "top   top"
      "cover cue"
      "cover title"
      "cover seek"
      "cover time"
      "cover ctrl";
    column-gap: 18px;
  }
  #p-top { grid-area: top; }
  #p-cover-wrap { grid-area: cover; min-height: 0; }
  #p-cue { grid-area: cue; max-height: none; min-height: 0; overflow-y: auto; }
  #p-title { grid-area: title; }
  #p-seek { grid-area: seek; margin: 8px 0 2px; }
  #p-time { grid-area: time; }
  #p-ctrl { grid-area: ctrl; }
  /* 자막만 보기: 표지 열 없이 전체 폭 사용 */
  #player.mode-sub {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top" "cue";
  }
}
/* OLED: 면이 검정이라 배경색으로 구분하던 곳은 옅은 흰색을 겹쳐 보이게 한다 */
:root[data-theme="black"] #d-tags span,
:root[data-theme="black"] .cue-line.cur { background: rgba(255,255,255,.09); }
:root[data-theme="black"] .track:active { background: rgba(255,255,255,.06); }
:root[data-theme="black"] #search { border: 1px solid var(--line); }
</style>

<script>
"use strict";
const $ = id => document.getElementById(id);
const ic = (n, f) => `<svg class="i${f ? " f" : ""}"><use href="#i-${n}"/></svg>`;
const audio = $("audio");
const enc = p => p.split("/").map(encodeURIComponent).join("/");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t => {
  if (!isFinite(t)) return "0:00";
  t = Math.floor(t);
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0");
};

// 서버가 자막 본문으로 판별한 언어 기준
const ccBadge = t => t.srt ? `<span class="cc${t.srtLang === "ko" ? " ko" : ""}">${t.srtLang === "ko" ? "KO" : "CC"}</span>` : "";

let works = [];            // 전체 작품
let curWork = null;        // 상세 화면에 표시 중인 작품
let playWork = null;       // 재생 중인 작품
let queue = [], curIdx = -1;

const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
};
let favs = new Set(store.get("favs", []));          // 즐겨찾기 작품 id
let doneTracks = store.get("doneTracks", {});       // 끝까지 들은 트랙 path
let lastPlayed = store.get("lastPlayed", null);     // 이어 듣기 정보
let favOnly = localStorage.getItem("favOnly") === "1";
let cues = [], activeKey = "", loadedSrt = null;
let trFollow = true;   // 전체 자막에서 현재 줄을 따라 스크롤할지. 손으로 스크롤하면 꺼진다
let seeking = false;
const SPEEDS = [1.0, 1.2, 1.5, 2.0, 0.8];
let speedIdx = 0;
let autoNext = localStorage.getItem("autoNext") !== "0";

/* ───── 라이브러리 ───── */
async function loadWorks() {
  works = await (await fetch("/api/works")).json();
  renderLibrary();
  backfillMeta();
}

function coverHtml(w, cls) {
  if (w.hasCover)
    return `<img loading="lazy" src="/api/cover/${enc(w.id)}" onerror="this.replaceWith(phEl('${esc(w.rj||w.id).slice(0,2)}'))" alt="">`;
  return `<div class="cover-ph">${esc((w.rj || w.id).slice(0, 4))}</div>`;
}
window.phEl = txt => { const d = document.createElement("div"); d.className = "cover-ph"; d.textContent = txt; return d; };

let sortMode = localStorage.getItem("sort") || "rj";

function renderLibrary() {
  const q = $("search").value.trim().toLowerCase();
  const list = works.filter(w => !q ||
    [w.title, w.titleOrig, w.circle, w.rj, ...(w.cvs||[]), ...(w.genres||[])].join(" ").toLowerCase().includes(q));
  const rjNum = w => w.rj ? +w.rj.slice(2) : Infinity;
  if (sortMode === "added") list.sort((a, b) => (b.added || 0) - (a.added || 0));
  else list.sort((a, b) => rjNum(a) - rjNum(b) || (a.id > b.id ? 1 : -1));
  const shown = favOnly ? list.filter(w => favs.has(w.id)) : list;
  $("count").textContent = `${shown.length}개 작품`;
  if (!works.length) {
    $("library").innerHTML = `<div id="empty">작품이 없습니다.<br>
      DLsite에서 다운로드한 작품 폴더를<br><code>works\\</code> 폴더에 넣고 새로고침하세요.<br><br>
      폴더명에 RJ코드가 있으면 표지·태그를 자동으로 가져옵니다.</div>`;
    return;
  }
  $("library").innerHTML = shown.map(w => {
    const hasSub = w.tracks.some(t => t.srt);
    const done = w.tracks.filter(t => doneTracks[t.path]).length;
    return `<div class="card" data-id="${esc(w.id)}">
      <div class="cover-box">${coverHtml(w)}
        ${w.rj ? `<span class="badge">${esc(w.rj)}</span>` : ""}
        ${favs.has(w.id) ? `<span class="fav-mark">${ic("heart", 1)}</span>` : ""}
        ${done ? `<div class="prog"><div style="width:${(done / w.tracks.length * 100).toFixed(0)}%"></div></div>` : ""}
      </div>
      <div class="info"><div class="t">${esc(w.title)}</div>
      <div class="c">${esc(w.circle || "")}${hasSub ? " · 자막" : ""}${done ? ` · ${done}/${w.tracks.length}` : ""}</div></div>
    </div>`;
  }).join("") || `<div id="empty">${favOnly ? "즐겨찾기한 작품이 없습니다" : "검색 결과 없음"}</div>`;
  document.querySelectorAll(".card").forEach(el =>
    el.onclick = () => openWork(works.find(w => w.id === el.dataset.id)));
  renderResume();
}

/* ───── 이어 듣기 카드 ───── */
function renderResume() {
  const box = $("resume");
  const w = lastPlayed && works.find(x => x.id === lastPlayed.workId);
  const path = lastPlayed && lastPlayed.paths && lastPlayed.paths[lastPlayed.idx];
  const t = w && w.tracks.find(x => x.path === path);
  if (!t) { box.innerHTML = ""; return; }
  const pos = +localStorage.getItem("pos:" + t.path) || 0;
  box.innerHTML = `<div id="resume-card">${coverHtml(w)}
    <div class="rt"><div class="a">이어 듣기</div><div class="b">${esc(t.name)} — ${esc(w.title)}</div></div>
    <span class="tm">${fmt(pos)}${lastPlayed.dur ? " / " + fmt(lastPlayed.dur) : ""}</span></div>`;
  $("resume-card").onclick = () => {
    const tracks = lastPlayed.paths.map(p => w.tracks.find(x => x.path === p)).filter(Boolean);
    if (tracks.length) playTrack(w, Math.min(lastPlayed.idx, tracks.length - 1), true, tracks);
  };
}

$("favbtn").classList.toggle("on", favOnly);
$("favbtn").onclick = () => {
  favOnly = !favOnly;
  localStorage.setItem("favOnly", favOnly ? "1" : "0");
  $("favbtn").classList.toggle("on", favOnly);
  renderLibrary();
};

// 메타데이터가 없거나 제목 번역만 실패한 작품을 백그라운드에서 순차 조회
async function backfillMeta() {
  for (const w of works) {
    if (!w.rj || (w.hasMeta && !w.titlePending)) continue;
    try {
      const m = await (await fetch(`/api/meta/${w.rj}`)).json();
      if (m.notfound) { w.hasMeta = true; continue; }
      Object.assign(w, { title: m.title || w.title, titleOrig: m.title_orig, circle: m.circle,
                         genres: m.genres, cvs: m.cvs, date: m.date, hasMeta: true,
                         titlePending: !!m.title_pending,
                         hasCover: w.hasCover || !!m.image });
    } catch (e) { /* 오프라인이면 폴더명으로 표시 */ }
  }
  renderLibrary();
  if (curWork) fillDetail(curWork);
}

$("search").oninput = renderLibrary;
$("sort").value = sortMode;
$("sort").onchange = () => {
  sortMode = $("sort").value;
  localStorage.setItem("sort", sortMode);
  renderLibrary();
};

/* ───── 상세 ───── */
function openWork(w) {
  curWork = w;
  expPath = localStorage.getItem("exp:" + w.id) || "";  // 탐색 위치 기억
  fillDetail(w);
  $("detail").classList.add("open");
  history.pushState({ v: "detail" }, "");
}
function fillDetail(w) {
  $("d-hero").innerHTML = coverHtml(w);
  $("d-title").textContent = w.title;
  $("d-orig").textContent = w.titleOrig && w.titleOrig !== w.title ? w.titleOrig : "";
  $("d-sub").innerHTML = `${w.rj ? `<span class="rj">${esc(w.rj)}</span> · ` : ""}${esc(w.circle || "")}${w.date ? " · " + esc(w.date.slice(0,10)) : ""}`;
  $("d-fav").innerHTML = ic("heart", favs.has(w.id));
  $("d-fav").classList.toggle("on", favs.has(w.id));
  $("d-tags").innerHTML =
    (w.cvs||[]).map(c => `<span class="cv" data-q="${esc(c)}"><i>CV</i>${esc(c)}</span>`).join("") +
    (w.genres||[]).map(g => `<span data-q="${esc(g)}">${esc(g)}</span>`).join("");
  // 태그 탭 → 그 태그로 라이브러리 필터
  document.querySelectorAll("#d-tags span").forEach(el =>
    el.onclick = () => {
      $("search").value = el.dataset.q;
      renderLibrary();
      history.back();
      window.scrollTo(0, 0);

}

/* 트랙 보기: 목록(평면) / 폴더 그룹 / 탐색(폴더 단위 이동) */
const TRACK_VIEWS = [["flat", "목록"], ["group", "폴더 그룹"], ["tree", "탐색"]];
let trackView = localStorage.getItem("trackView") ||
  (localStorage.getItem("showFolders") === "0" ? "flat" : "group");
let expPath = "";  // 탐색 모드의 현재 폴더

function renderTracks(w) {
  const hasFolders = w.tracks.some(t => t.folder) || (w.others || []).some(o => o.folder);
  $("d-count").textContent = `${w.tracks.length}개 트랙`;
  $("d-folders").style.display = hasFolders ? "" : "none";
  $("d-folders").textContent = (TRACK_VIEWS.find(v => v[0] === trackView) || TRACK_VIEWS[0])[1];
  $("d-folders").classList.toggle("on", trackView !== "flat");
  const view = hasFolders ? trackView : "flat";
  if (view === "tree") return renderTree(w);

  const grouped = view === "group";
  let html = "", last = null;
  w.tracks.forEach((t, i) => {
    if (grouped && t.folder !== last) {
      html += `<div class="folder-h">${ic("folder")}${esc(t.folder || "(루트)")}</div>`;
      last = t.folder;
    }
    html += trackRow(t, i, !grouped);
  });
  $("d-tracks").innerHTML = html;
  document.querySelectorAll(".track").forEach(el =>
    el.onclick = () => playTrack(w, +el.dataset.i, true));
  markPlaying();
}

function trackRow(t, i, showPath) {
  return `
    <div class="track" data-i="${i}">
      <span class="no">${i+1}</span>
      <div class="tn"><div class="n">${esc(t.name)}</div>${showPath && t.folder ? `<div class="f">${esc(t.folder)}</div>` : ""}</div>
      ${ccBadge(t)}
      <span class="sz">${(t.size/1048576).toFixed(0)}MB</span>
    </div>`;
}

function renderTree(w) {
  const items = [...w.tracks.map((t, i) => ({ ...t, kind: "audio", ti: i })), ...(w.others || [])];
  // 저장돼 있던 경로가 더 이상 존재하지 않으면(폴더명 변경 등) 루트로
  if (expPath && !items.some(it => { const f = it.folder || ""; return f === expPath || f.startsWith(expPath + "/"); }))
    expPath = "";
  localStorage.setItem("exp:" + w.id, expPath);
  const dirs = new Set(), files = [];
  const prefix = expPath ? expPath + "/" : "";
  for (const it of items) {
    const f = it.folder || "";
    if (f === expPath) files.push(it);
    else if (f.startsWith(prefix) && f.length > prefix.length) dirs.add(f.slice(prefix.length).split("/")[0]);
  }
  const nat = s => s.split(/(\d+)/).map(x => /^\d+$/.test(x) ? x.padStart(9, "0") : x.toLowerCase()).join("");
  files.sort((a, b) => nat(a.name) < nat(b.name) ? -1 : 1);

  let html = `<div id="crumb"><button id="exp-up" ${expPath ? "" : "disabled"}>${ic("corner-left-up")}</button><span>/${esc(expPath)}</span></div>`;
  html += [...dirs].sort((a, b) => nat(a) < nat(b) ? -1 : 1).map(d =>
    `<div class="track dir" data-d="${esc(d)}"><span class="no">${ic("folder")}</span><div class="tn"><div class="n">${esc(d)}</div></div><span class="sz">${ic("chevron-right")}</span></div>`).join("");
  html += files.map(it => it.kind === "audio"
    ? `<div class="track" data-i="${it.ti}"><span class="no">${ic("play")}</span><div class="tn"><div class="n">${esc(it.name)}</div></div>${ccBadge(it)}<span class="sz">${(it.size/1048576).toFixed(0)}MB</span></div>`
    : `<div class="track other" data-p="${esc(it.path)}" data-k="${it.kind}"><span class="no">${ic(it.kind === "image" ? "image" : "file-text")}</span><div class="tn"><div class="n">${esc(it.name)}</div></div></div>`).join("");
  $("d-tracks").innerHTML = html;

  const up = $("exp-up");
  if (up) up.onclick = () => { expPath = expPath.split("/").slice(0, -1).join("/"); renderTree(w); };
  document.querySelectorAll(".track.dir").forEach(el =>
    el.onclick = () => { expPath = expPath ? expPath + "/" + el.dataset.d : el.dataset.d; renderTree(w); });
  // 탐색 모드에서는 재생 큐를 현재 폴더의 오디오로 한정 (다음 방 스포일러 방지)
  const folderTracks = files.filter(f => f.kind === "audio");
  document.querySelectorAll(".track[data-i]").forEach(el =>
    el.onclick = () => playTrack(w, folderTracks.findIndex(f => f.ti === +el.dataset.i), true,
                                 folderTracks.map(f => w.tracks[f.ti])));
  document.querySelectorAll(".track.other").forEach(el =>
    el.onclick = () => openViewer(el.dataset.p, el.dataset.k));
  markPlaying();
}

$("d-folders").onclick = () => {
  const i = TRACK_VIEWS.findIndex(v => v[0] === trackView);
  trackView = TRACK_VIEWS[(i + 1) % TRACK_VIEWS.length][0];
  localStorage.setItem("trackView", trackView);
  if (curWork) renderTracks(curWork);
};

/* ───── 이미지·텍스트 뷰어 ───── */
function openViewer(path, kind) {
  if (kind === "file") { window.open("/api/audio/" + enc(path)); return; }
  $("v-body").innerHTML = kind === "image"
    ? `<img src="/api/audio/${enc(path)}" alt="">`
    : `<pre>불러오는 중…</pre>`;
  if (kind === "text")
    fetch("/api/srt/" + enc(path)).then(r => r.text())
      .then(t => $("v-body").innerHTML = `<pre>${esc(t)}</pre>`)
      .catch(() => $("v-body").innerHTML = `<pre>읽기 실패</pre>`);
  $("viewer").classList.add("open");
  history.pushState({ v: "viewer" }, "");
}
$("v-close").onclick = () => history.back();
function markPlaying() {
  const cur = queue[curIdx];
  document.querySelectorAll(".track[data-i]").forEach(el => {
    const t = curWork && curWork.tracks[+el.dataset.i];
    el.classList.toggle("playing", !!(cur && t && t.path === cur.path));
  });
}
$("d-back").onclick = () => history.back();
$("d-fav").onclick = () => {
  if (!curWork) return;
  favs.has(curWork.id) ? favs.delete(curWork.id) : favs.add(curWork.id);
  store.set("favs", [...favs]);
  $("d-fav").innerHTML = ic("heart", favs.has(curWork.id));
  $("d-fav").classList.toggle("on", favs.has(curWork.id));
  renderLibrary();
};

/* ───── 재생 ───── */
function playTrack(w, i, openPlayer, q) {
  queue = q || w.tracks; curIdx = i; playWork = w;
  const t = queue[i];
  audio.src = "/api/audio/" + enc(t.path);
  audio.playbackRate = SPEEDS[speedIdx];
  const saved = +localStorage.getItem("pos:" + t.path) || 0;
  audio.currentTime = 0;
  audio.play().then(() => { if (saved > 5 && saved < (audio.duration || 1e9) - 10) audio.currentTime = saved; });
  loadSrt(t);
  $("mini").classList.add("on");
  $("mini-title").textContent = t.name;
  $("mini-cover").innerHTML = $("p-cover").innerHTML = coverHtml(w);
  $("p-work").textContent = t.name;    // 상단바: 모든 보기 모드에서 트랙명 노출
  $("p-title").textContent = t.name;
  markPlaying();
  setMediaSession(w, t);
  lastPlayed = { workId: w.id, paths: queue.map(x => x.path), idx: curIdx, dur: 0 };
  store.set("lastPlayed", lastPlayed);
  renderResume();
  if (openPlayer) showPlayer();
}

audio.onloadedmetadata = () => {
  if (lastPlayed && audio.duration) {
    lastPlayed.dur = audio.duration;
    store.set("lastPlayed", lastPlayed);
    renderResume();
  }
};
// 앱을 켜둔 사이 이름 번역으로 경로가 바뀌면 재생이 실패한다. 목록을 새로 받아 이어서 재생한다
let recovering = false;
audio.onerror = async () => {
  const t = queue[curIdx];
  if (!t || !audio.getAttribute("src") || recovering) return;
  recovering = true;
  try {
    const { files, works: moved } = await (await fetch("/api/renames")).json();
    const to = p => files[p] || p;
    if (to(t.path) === t.path) { showToast("이 브라우저에서 재생할 수 없는 파일입니다"); return; }
    const paths = queue.map(x => to(x.path)), target = to(t.path), id = moved[playWork.id] || playWork.id;
    const reopen = curWork && curWork.id === playWork.id;
    await applyRenames();
    works = await (await fetch("/api/works")).json();
    renderLibrary();
    const w = works.find(x => x.id === id);
    const tracks = w ? paths.map(p => w.tracks.find(x => x.path === p)).filter(Boolean) : [];
    const i = tracks.findIndex(x => x.path === target);
    if (i < 0) { showToast("파일을 찾지 못했습니다. 새로고침해 주세요"); return; }
    if (reopen) { curWork = w; renderTracks(w); }
    showToast("이름이 바뀌어 목록을 새로 불러왔습니다");
    playTrack(w, i, false, tracks);
  } catch (e) {
    showToast("재생하지 못했습니다");
  } finally {
    recovering = false;
  }
};

let toastTimer = null;
function showToast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2600);
}

const next = () => curIdx < queue.length - 1 && playTrack(playWork, curIdx + 1, false, queue);
const prev = () => curIdx > 0 && playTrack(playWork, curIdx - 1, false, queue);

audio.onended = () => {
  const t = queue[curIdx];
  if (t) {
    localStorage.removeItem("pos:" + t.path);
    doneTracks[t.path] = 1;          // 끝까지 들은 트랙 기록 → 카드 진행률
    store.set("doneTracks", doneTracks);
    renderLibrary();
  }
  if (autoNext) {
    const from = curIdx;
    next();
    if (curIdx !== from) showToast(queue[curIdx].name);  // 자동 전환만 알린다
  }
};
audio.onplay = audio.onpause = () => {
  const s = ic(audio.paused ? "play" : "pause", 1);
  $("mini-play").innerHTML = s; $("p-play").innerHTML = s;
};
audio.ontimeupdate = () => {
  const d = audio.duration || 0, c = audio.currentTime;
  if (!seeking) $("p-seek").value = d ? c / d * 1000 : 0;
  $("mini-bar").firstElementChild.style.width = d ? c / d * 100 + "%" : 0;
  $("p-cur").textContent = fmt(c); $("p-dur").textContent = fmt(d);
  updateCue(c);
  if (Math.floor(c) % 5 === 0 && c > 5) localStorage.setItem("pos:" + queue[curIdx].path, c);
};

$("mini-play").onclick = e => { e.stopPropagation(); audio.paused ? audio.play() : audio.pause(); };
$("mini-next").onclick = e => { e.stopPropagation(); next(); };
$("mini-open").onclick = showPlayer;
$("p-play").onclick = () => audio.paused ? audio.play() : audio.pause();
$("p-next").onclick = next;
$("p-prev").onclick = prev;
$("p-back10").onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 10);
$("p-fwd10").onclick = () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
$("p-speed").onclick = () => {

$("p-loop").onclick = () => {

};
$("p-loop").style.color = autoNext ? "var(--fg)" : "";
$("p-seek").oninput = () => { seeking = true; $("p-cur").textContent = fmt($("p-seek").value / 1000 * (audio.duration || 0)); };
$("p-seek").onchange = () => { audio.currentTime = $("p-seek").value / 1000 * (audio.duration || 0); seeking = false; };

function showPlayer() { $("player").classList.add("open"); history.pushState({ v: "player" }, ""); }
$("p-close").onclick = () => { closeSettings(); history.back(); };

// 표지·자막 영역 탭 = 재생/일시정지 (미니멀 모드에서 컨트롤 없이 조작)
/* ───── 몰입 모드 ───── */
let immersive = false, peekTimer = null;

async function setImmersive(on) {
  immersive = on;
  document.body.classList.toggle("immersive", on);
  document.body.classList.remove("chrome-peek");
  clearTimeout(peekTimer);
  $("p-full").classList.toggle("on", on);
  // 실제 상태바·브라우저 크롬은 Fullscreen API 로만 사라진다.
  // 사용자 제스처 없이 부르면 거부되므로 실패는 그냥 삼킨다.
  try {
    if (on && !document.fullscreenElement)
      await document.documentElement.requestFullscreen({ navigationUI: "hide" });
    else if (!on && document.fullscreenElement)
      await document.exitFullscreen();
  } catch (e) { /* iOS Safari 등 미지원 — 앱 UI만 숨긴 채로 진행 */ }
}

// 몰입 중 화면을 누르면 상단바를 3초간 보여준다 (빠져나갈 수단)
function peekChrome() {
  document.body.classList.add("chrome-peek");
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => document.body.classList.remove("chrome-peek"), 3000);
}

$("p-full").onclick = () => setImmersive(!immersive);

// 시스템 뒤로가기·제스처로 전체화면이 풀리면 상태를 맞춘다

});

/* ───── 테마 ───── */
const THEME_BG = { dark: "#141415", black: "#000000", light: "#fafaf9" };
let theme = localStorage.getItem("theme") || "dark";
function applyTheme() {
  if (!THEME_BG[theme]) theme = "dark";
  // 기본값은 속성을 지워 :root 원본 정의를 그대로 쓴다
  if (theme === "dark") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  // 브라우저 모드에서 상태바 색을 테마에 맞춘다 (전체화면일 땐 무시됨)

  document.querySelectorAll("#set-themes button").forEach(b =>
    b.classList.toggle("sel", b.dataset.t === theme));
  localStorage.setItem("theme", theme);
}

$("p-aa").onclick = toggleSettings;
$("setbtn").onclick = toggleSettings;

/* ───── SRT/VTT 자막 ───── */
async function loadSrt(t) {
  cues = []; activeKey = ""; loadedSrt = t.srt || null;
  $("p-cue").className = "none"; $("p-cue").textContent = "자막 없음";
  $("mini-cue").textContent = "";
  $("p-tr").classList.remove("on");
  renderTranscript();
  if (!t.srt) return;
  try {
    const text = await (await fetch("/api/srt/" + enc(t.srt))).text();
    if (loadedSrt !== t.srt) return;   // 그 사이 트랙이 바뀜
    cues = parseSrt(text);
    if (cues.length) {
      $("p-cue").textContent = "";
      $("p-tr").classList.add("on");
      renderTranscript();
    } else $("p-cue").textContent = "자막 없음";
  } catch (e) { console.warn("자막 로드 실패", e); }
}

function parseSrt(text) {
  // 줄 단위 파서: SRT / VTT / SRT 구조의 txt 모두 처리.
  // 빈 줄 구분이 없거나 인덱스 번호가 빠진 파일도 허용.
  const out = [];
  // 시간 형식: HH:MM:SS,mmm 또는 MM:SS.mmm (시 부분 생략 가능)
  const TIME = /(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[.,](\d{1,3})\s*-->\s*(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[.,](\d{1,3})/;
  let cur = null;
  const flush = () => {
    if (cur) {
      // 빈 줄 없이 다음 큐가 붙은 경우 말미의 인덱스 번호 제거
      while (cur.txt.length && /^\d+$/.test(cur.txt[cur.txt.length - 1])) cur.txt.pop();
      const txt = cur.txt.join("\n").trim();
      if (txt) out.push({ s: cur.s, e: cur.e, txt });
    }
    cur = null;
  };
  for (const raw of text.replace(/\r/g, "").split("\n")) {
    const line = raw.trim();
    if (line.includes("-->")) {
      const m = line.match(TIME);
      flush();
      if (m) cur = {
        s: (+m[1] || 0)*3600 + +m[2]*60 + +m[3] + +m[4].padEnd(3,"0")/1000,
        e: (+m[5] || 0)*3600 + +m[6]*60 + +m[7] + +m[8].padEnd(3,"0")/1000,
        txt: [],
      };
    } else if (!line) {
      // 텍스트가 이미 있으면 큐 종료. 타임코드와 텍스트 사이에 빈 줄이
      // 끼어 있는 변형 SRT는 큐를 유지한 채 계속 읽는다.
      if (cur && cur.txt.length) flush();
    } else if (cur) {
      cur.txt.push(line.replace(/<[^>]+>/g, ""));
    }
    // cur가 없을 때의 줄(WEBVTT 헤더, NOTE, 인덱스 번호 등)은 무시
  }
  flush();
  return out.sort((a, b) => a.s - b.s);
}

function updateCue(t) {
  if (!cues.length) return;
  // 현재 시각에 활성인 큐를 전부 수집 — 화자가 여럿이라 시간이 겹치면 위아래로 쌓아 표시.
  // 시작시간 정렬이므로 s > t 이후는 볼 필요 없음.
  const act = [];
  let last = -1;   // 이미 시작한 마지막 줄 — 대사 사이 구간의 위치 표시용
  for (let i = 0; i < cues.length; i++) {
    if (cues[i].s > t) break;
    last = i;
    if (t < cues[i].e) act.push(i);
  }
  const key = act.length ? act.join(",") : "p" + last;
  if (key === activeKey) return;
  const textChanged = act.length || activeKey === "" || !activeKey.startsWith("p");
  activeKey = key;
  if (textChanged) {
    $("p-cue").className = "";
    $("p-cue").innerHTML = act.map(i =>
      `<div class="cline">${esc(cues[i].txt).replace(/\n/g, "<br>")}</div>`).join("");
    $("mini-cue").textContent = act.map(i => cues[i].txt.replace(/\n/g, " ")).join("  ∥  ");
  }
  document.querySelectorAll(".cue-line.cur, .cue-line.prev").forEach(el => el.classList.remove("cur", "prev"));
  act.forEach(i => { const el = $("tr-list").children[i]; if (el) el.classList.add("cur"); });
  if (!act.length && last >= 0) { const el = $("tr-list").children[last]; if (el) el.classList.add("prev"); }
  if (trFollow && $("transcript").classList.contains("open")) scrollToCurrent(true);
}

function scrollToCurrent(smooth) {
  const el = document.querySelector(".cue-line.cur, .cue-line.prev");
  if (!el) return;
  // 멀리 떨어져 있으면(탐색·버튼) 바로 이동한다. 부드러운 스크롤은 길면 느리고 중간에 끊긴다
  const list = $("tr-list"), far = Math.abs(el.offsetTop - list.scrollTop - list.clientHeight / 2) > list.clientHeight;
  el.scrollIntoView({ block: "center", behavior: smooth && !far ? "smooth" : "auto" });
}
function setFollow(on) {
  trFollow = on;
  $("tr-follow").classList.toggle("show", !on);
  if (on) scrollToCurrent(true);
}
// 사용자가 직접 스크롤할 때만 따라가기를 끈다 (자동 스크롤이 내는 scroll 이벤트와 구분)
["wheel", "touchmove"].forEach(ev =>
  $("tr-list").addEventListener(ev, () => { if (trFollow) setFollow(false); }, { passive: true }));
$("tr-list").addEventListener("keydown", () => { if (trFollow) setFollow(false); });
$("tr-follow").onclick = () => setFollow(true);

function renderTranscript() {
  $("tr-list").innerHTML = cues.length
    ? cues.map((c, i) => `<div class="cue-line" data-i="${i}"><span class="ts">${fmt(c.s)}</span>${esc(c.txt)}</div>`).join("")
    : `<div class="spin">이 트랙에는 자막이 없습니다</div>`;
  document.querySelectorAll(".cue-line").forEach(el =>
    el.onclick = () => { audio.currentTime = cues[+el.dataset.i].s; audio.play(); setFollow(true); });
}
$("p-tr").onclick = () => {
  closeSettings();
  $("transcript").classList.add("open");
  history.pushState({ v: "tr" }, "");
  trFollow = true; $("tr-follow").classList.remove("show");
  scrollToCurrent(false);
};
$("tr-close").onclick = () => history.back();

/* ───── 잠금화면 컨트롤 ───── */
function setMediaSession(w, t) {
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.name, artist: w.circle || "", album: w.title,
    artwork: w.hasCover ? [{ src: "/api/cover/" + enc(w.id), sizes: "512x512" }] : [],
  });
  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("previoustrack", prev);
  navigator.mediaSession.setActionHandler("nexttrack", next);
  navigator.mediaSession.setActionHandler("seekbackward", () => audio.currentTime -= 10);
  navigator.mediaSession.setActionHandler("seekforward", () => audio.currentTime += 10);
}

/* ───── 자막 자동 생성 실패 알림 ───── */
function renderFailures(list) {
  $("fail").classList.toggle("on", list.length > 0);
  if (!list.length) { $("fail").classList.remove("open"); $("fail-more").textContent = "자세히"; return; }
  const errors = list.filter(f => f.kind === "error").length;
  $("fail-n").textContent = `자막 ${errors ? `실패 ${errors}건` : ""}${errors && errors < list.length ? " · " : ""}` +
    `${errors < list.length ? `확인 필요 ${list.length - errors}건` : ""}`;
  $("fail-list").innerHTML = [...list].reverse().map(f =>
    `<div class="fail-i"><b>${esc(f.path || "자동 생성")}</b>${esc(f.msg)}${f.count > 1 ? ` (${f.count}회)` : ""}</div>`).join("");
}
async function checkFailures(method) {
  try { renderFailures(await (await fetch("/api/subgen/failures", { method })).json()); }
  catch (e) { /* 서버가 꺼져 있으면 다음 확인 때 다시 본다 */ }
}
$("fail-more").onclick = () => {
  $("fail-more").textContent = $("fail").classList.toggle("open") ? "접기" : "자세히";
};
$("fail-ok").onclick = () => checkFailures("DELETE");
setInterval(checkFailures, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkFailures(); });
checkFailures();

// 서버가 파일·폴더 이름을 한글로 바꾸면 경로로 저장한 기록도 새 경로로 옮긴다
async function applyRenames() {
  try {
    const { files, works: moved } = await (await fetch("/api/renames")).json();
    const to = p => files[p] || p;
    for (const [p, q] of Object.entries(files)) {
      const pos = localStorage.getItem("pos:" + p);
      if (pos !== null) { localStorage.setItem("pos:" + q, pos); localStorage.removeItem("pos:" + p); }
    }
    if (Object.keys(doneTracks).some(p => files[p])) {
      doneTracks = Object.fromEntries(Object.entries(doneTracks).map(([p, v]) => [to(p), v]));
      store.set("doneTracks", doneTracks);
    }
    if (lastPlayed && (lastPlayed.paths || []).some(p => files[p]) || lastPlayed && moved[lastPlayed.workId]) {
      lastPlayed.paths = (lastPlayed.paths || []).map(to);
      lastPlayed.workId = moved[lastPlayed.workId] || lastPlayed.workId;
      store.set("lastPlayed", lastPlayed);
    }
    if ([...favs].some(id => moved[id])) {
      favs = new Set([...favs].map(id => moved[id] || id));
      store.set("favs", [...favs]);
    }
  } catch (e) { console.warn("이름 변경 기록 반영 실패", e); }
}

applyRenames().finally(loadWorks);
</script>
