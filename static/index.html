<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<title>ASMR 라이브러리</title>
<style>
:root {
  /* 기본(다크) — data-theme 없을 때 */
  --bg: #0f1117; --bg2: #171a23; --bg3: #1f2330;
  --fg: #e2e8f0; --fg-dim: #8b93a7;
  --accent: #f472b6; --accent2: #a78bfa;
  --line: #2a2f3e; --line2: #1d212d; --card-line: #262b3a;
  --dim2: #3b4258; --dim3: #4b5268;
  --head-bg: rgba(15,17,23,.92); --sheet-bg: rgba(10,12,17,.97);
  --ph1: #1c2030; --ph2: #252a3d;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="black"] {
  /* OLED — 완전한 검정 */
  --bg: #000; --bg2: #0a0a0c; --bg3: #131316;
  --fg: #e8e8ea; --fg-dim: #8a8a94;
  --line: #232327; --line2: #17171a; --card-line: #1e1e22;
  --dim2: #3a3a42; --dim3: #4a4a55;
  --head-bg: rgba(0,0,0,.92); --sheet-bg: rgba(0,0,0,.98);
  --ph1: #101013; --ph2: #1c1c21;
}
:root[data-theme="light"] {
  --bg: #f7f7fa; --bg2: #ffffff; --bg3: #eceef3;
  --fg: #1b1e26; --fg-dim: #6b7280;
  --line: #dcdfe7; --line2: #e8eaf0; --card-line: #e2e5ec;
  --dim2: #b9bec9; --dim3: #8d94a2;
  --head-bg: rgba(247,247,250,.92); --sheet-bg: rgba(255,255,255,.98);
  --ph1: #e6e8ef; --ph2: #d7dae3;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }

/* ── 헤더 ── */
#header {
  position: sticky; top: 0; z-index: 20;
  background: var(--head-bg); backdrop-filter: blur(10px);
  padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 10px;
}
#header .row { display: flex; align-items: center; gap: 10px; }
#header h1 { font-size: 18px; margin: 0; flex: 1; }
#header h1 b { color: var(--accent); }
#count { font-size: 12px; color: var(--fg-dim); }
#sort {
  background: var(--bg2); color: var(--fg-dim); border: 1px solid var(--line);
  border-radius: 9px; font-size: 12px; padding: 5px 8px; outline: none;
}
#favbtn { font-size: 16px; color: var(--dim2); width: 32px; height: 32px; }
#favbtn.on { color: var(--accent); }
#setbtn { font-size: 16px; color: var(--dim2); width: 32px; height: 32px; }
#setbtn.on { color: var(--accent2); }

/* ── 이어 듣기 카드 ── */
#resume { padding: 10px 14px 0; }
#resume:empty { display: none; }
#resume-card {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  background: var(--bg2); border: 1px solid var(--card-line); border-radius: 14px; padding: 8px 12px;
}
#resume-card:active { transform: scale(.985); }
#resume-card img, #resume-card .cover-ph {
  width: 42px; height: 42px; border-radius: 9px; object-fit: cover; font-size: 13px; flex-shrink: 0;
}
#resume-card .rt { flex: 1; min-width: 0; }
#resume-card .rt .a { font-size: 11px; color: var(--accent2); font-weight: 700; }
#resume-card .rt .b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
#resume-card .tm { font-size: 11px; color: var(--fg-dim); flex-shrink: 0; font-variant-numeric: tabular-nums; }

/* ── 카드 진행률·즐겨찾기 표시 ── */
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(0,0,0,.45); }
.prog div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.fav-mark { position: absolute; right: 7px; bottom: 8px; font-size: 12px; color: var(--accent); text-shadow: 0 0 5px #000; }
#search {
  width: 100%; padding: 9px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg2); color: var(--fg); font-size: 15px; outline: none;
}
#search:focus { border-color: var(--accent2); }

/* ── 라이브러리 그리드 ── */
#library {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px; padding: 12px 14px calc(140px + var(--safe-b));
}
.card { border-radius: 14px; overflow: hidden; background: var(--bg2); cursor: pointer; }
.card:active { transform: scale(.97); }
.cover-box { aspect-ratio: 4/3; background: var(--bg3); position: relative; overflow: hidden; }
.cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-ph {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 700; color: var(--dim2);
  background: linear-gradient(135deg, var(--ph1), var(--ph2));
}
.badge {
  position: absolute; left: 6px; top: 6px; font-size: 10px; font-weight: 700;
  background: rgba(0,0,0,.65); color: #fbcfe8; padding: 2px 7px; border-radius: 99px;
}
.badge.sub { left: auto; right: 6px; color: #c4b5fd; }
.card .info { padding: 8px 10px 10px; }
.card .t {
  font-size: 13px; line-height: 1.35; height: 2.7em; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.card .c { font-size: 11px; color: var(--fg-dim); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#empty { grid-column: 1/-1; text-align: center; color: var(--fg-dim); padding: 60px 20px; font-size: 14px; line-height: 1.8; }
#empty code { background: var(--bg3); padding: 2px 6px; border-radius: 6px; font-size: 12px; }

/* ── 작품 상세 ── */
#detail {
  position: fixed; inset: 0; z-index: 30; background: var(--bg);
  transform: translateX(100%); transition: transform .25s ease; overflow-y: auto;
  padding-bottom: calc(140px + var(--safe-b));
}
#detail.open { transform: translateX(0); }
#detail .hero { position: relative; }
#detail .hero img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
#detail .hero .cover-ph { aspect-ratio: 4/3; font-size: 44px; }
#detail .hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 55%, var(--bg));
}
#d-back, #d-fav {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 31;
  width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.55);
  backdrop-filter: blur(6px); font-size: 18px; display: flex; align-items: center; justify-content: center;
}
#d-fav { left: auto; right: 12px; font-size: 17px; }
#d-fav.on { color: var(--accent); }
#d-tags span:active { opacity: .55; }
#d-body { padding: 0 16px; margin-top: -34px; position: relative; }
#d-title { font-size: 18px; font-weight: 700; line-height: 1.4; margin: 0 0 6px; }
#d-orig { font-size: 12px; color: var(--dim3); line-height: 1.4; margin: -2px 0 6px; }
#d-orig:empty { display: none; }
#d-sub { font-size: 13px; color: var(--fg-dim); margin-bottom: 10px; }
#d-sub .rj { color: var(--accent); font-weight: 600; }
#d-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
#d-tags span {
  font-size: 11px; padding: 3px 9px; border-radius: 99px;
  background: var(--bg3); color: var(--fg);
}
#d-tags span.cv { background: #3b2437; color: #fbcfe8; }
#d-listhead {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 4px 6px; font-size: 12px; color: var(--fg-dim);
}
#d-folders { font-size: 11px; font-weight: 700; color: var(--dim3); border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; }
#d-folders.on { color: var(--accent2); border-color: var(--accent2); }
.folder-h {
  font-size: 12px; font-weight: 700; color: var(--accent2);
  padding: 14px 4px 5px; border-bottom: 1px solid var(--line2);
}
/* ── 탐색 모드 ── */
#crumb {
  display: flex; align-items: center; gap: 9px; padding: 8px 0 5px;
  font-size: 12px; color: var(--fg-dim); word-break: break-all;
}
#exp-up { width: 36px; height: 30px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; flex-shrink: 0; }
#exp-up:disabled { opacity: .3; }
.track.dir .n { color: var(--fg); font-weight: 600; }
.track.other .n { color: var(--fg-dim); }
/* ── 이미지·텍스트 뷰어 ── */
#viewer {
  position: fixed; inset: 0; z-index: 70; background: var(--sheet-bg);
  display: none; flex-direction: column;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 14px calc(14px + var(--safe-b));
}
#viewer.open { display: flex; }
#v-close { align-self: flex-end; font-size: 20px; width: 42px; height: 42px; flex-shrink: 0; }
#v-body { flex: 1; overflow: auto; }
#v-body img { display: block; max-width: 100%; height: auto; margin: 0 auto; border-radius: 12px; }
#v-body pre { white-space: pre-wrap; word-break: break-word; font: 14px/1.7 inherit; margin: 0; color: var(--fg); }
.track {
  display: flex; align-items: center; gap: 12px; padding: 11px 4px;
  border-bottom: 1px solid var(--line2); cursor: pointer;
}
.track:active { background: var(--bg2); }
.track .no { width: 26px; text-align: center; color: var(--fg-dim); font-size: 12px; flex-shrink: 0; }
.track.playing .no { color: var(--accent); }
.track .tn { flex: 1; min-width: 0; }
.track .tn .n { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track.playing .tn .n { color: var(--accent); font-weight: 600; }
.track .tn .f { font-size: 11px; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.track .cc {
  flex-shrink: 0; font-size: 10px; font-weight: 700; color: var(--accent2);
  border: 1px solid var(--accent2); border-radius: 4px; padding: 1px 5px;
}
.track .cc.ko { color: var(--accent); border-color: var(--accent); }
.track .sz { flex-shrink: 0; font-size: 11px; color: var(--fg-dim); }

/* ── 미니 플레이어 ── */
#mini {
  position: fixed; left: 10px; right: 10px; bottom: calc(10px + var(--safe-b)); z-index: 40;
  background: var(--bg3); border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.5);
  display: none; overflow: hidden;
}
#mini.on { display: block; }
#mini-bar { height: 3px; background: var(--line); }
#mini-bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
#mini .inner { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; }
#mini img, #mini .cover-ph { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex-shrink: 0; font-size: 16px; }
#mini .tt { flex: 1; min-width: 0; }
#mini .tt .n { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mini .tt .cue { font-size: 11px; color: var(--cue-color, var(--accent2)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; min-height: 13px; }
#mini button { font-size: 22px; width: 40px; height: 40px; flex-shrink: 0; }

/* ── 전체 플레이어 ── */
#player {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  transform: translateY(100%); transition: transform .28s ease;
  display: flex; flex-direction: column;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 20px calc(16px + var(--safe-b));
}
#player.open { transform: translateY(0); }
#p-top { display: flex; align-items: center; }
#p-close { font-size: 22px; width: 42px; height: 42px; }
#p-work { flex: 1; text-align: center; font-size: 12px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
#p-tr { font-size: 20px; width: 42px; height: 42px; color: var(--fg-dim); }
#p-tr.on { color: var(--accent2); }
#p-cover-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px 0; }
#p-cover-wrap img, #p-cover-wrap .cover-ph {
  max-width: 100%; max-height: 100%; aspect-ratio: 4/3; border-radius: 18px;
  object-fit: cover; box-shadow: 0 10px 40px rgba(0,0,0,.55); font-size: 40px;
}
#p-cue {
  min-height: 66px; max-height: 34vh; overflow-y: auto;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 6px 4px; line-height: 1.5;
  font-size: var(--cue-size, 16px); color: var(--cue-color, #f9a8d4);
}
#p-cue.none { color: var(--dim2); font-size: 13px; }
#p-cue { flex-direction: column; }
#p-cue .cline + .cline { margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line); }

/* ── 보기 모드 (전체 / 표지+자막 / 자막만) ── */
.topbtn { font-size: 13px; font-weight: 700; width: 42px; height: 42px; color: var(--fg-dim); }
#player.mode-cover #p-title, #player.mode-cover #p-seek, #player.mode-cover #p-time, #player.mode-cover #p-ctrl,
#player.mode-sub #p-title, #player.mode-sub #p-seek, #player.mode-sub #p-time, #player.mode-sub #p-ctrl,
#player.mode-sub #p-cover-wrap { display: none; }
#player.mode-cover #p-cue, #player.mode-sub #p-cue { flex: 1; max-height: none; line-height: 1.7; }

/* ── 몰입 모드: 표지와 자막만 남기고 전부 숨김 ── */
body.immersive #header, body.immersive #mini, body.immersive #p-top,
body.immersive #p-title, body.immersive #p-ctrl { display: none; }
/* 재생바·시간은 건드리지 않는다 — mode-cover/mode-sub 규칙이 이미 숨기므로
   결과적으로 '전체' 모드에서만 남는다 (되살리는 예외 규칙이 필요 없음) */
/* 화면을 한 번 누르면 상단바만 잠깐 되살아난다 (몰입 해제용) */
body.immersive.chrome-peek #p-top { display: flex; }
body.immersive #p-cue { flex: 1; max-height: none; line-height: 1.7; }
#p-full.on { color: var(--accent2); }

/* ── 트랙 자동 전환 알림 ── */
#toast {
  position: fixed; left: 50%; bottom: calc(100px + var(--safe-b)); z-index: 90;
  transform: translateX(-50%) translateY(10px);
  background: var(--bg3); color: var(--fg); border: 1px solid var(--line);
  border-radius: 99px; padding: 9px 18px; font-size: 13px; font-weight: 600;
  max-width: 78vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
  opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 자막 설정 패널 ── */
#p-settings {
  /* body 직속 — 라이브러리 화면과 플레이어 양쪽에서 열린다 */
  position: fixed; top: calc(56px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 60;
  background: var(--bg3); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px 16px; width: 250px;
  box-shadow: 0 8px 30px rgba(0,0,0,.6); display: none;
}
#set-themes { display: flex; gap: 7px; margin-left: auto; }
#set-themes button {
  width: 30px; height: 26px; border-radius: 8px; border: 2px solid var(--line);
  font-size: 10px; font-weight: 700; color: var(--fg-dim);
}
#set-themes button.sel { border-color: var(--accent2); color: var(--fg); }
#set-themes button[data-t="dark"]  { background: #0f1117; }
#set-themes button[data-t="black"] { background: #000; }
#set-themes button[data-t="light"] { background: #f7f7fa; color: #6b7280; }
.set-sep { height: 1px; background: var(--line); margin: 12px -16px 0; }
#p-settings.open { display: block; }
#p-settings { max-height: calc(100dvh - 76px - env(safe-area-inset-top, 0px)); overflow-y: auto; }
#fail {
  display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 95; color: #fff; background: #b91c1c;
  padding: calc(9px + env(safe-area-inset-top, 0px)) 14px 9px; box-shadow: 0 4px 18px rgba(0,0,0,.5);
}
#fail.on { display: block; }
#fail-head { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
#fail-n { flex: 1; }
#fail button { color: #fff; font-size: 12px; font-weight: 700; border: 1px solid #fff; border-radius: 99px; padding: 4px 11px; }
#fail-list { display: none; max-height: 45dvh; overflow-y: auto; margin-top: 8px; font-size: 12px; line-height: 1.45; }
#fail.open #fail-list { display: block; }
.fail-i { padding: 6px 0; border-top: 1px solid rgba(255,255,255,.3); overflow-wrap: anywhere; }
.fail-i b { display: block; }
.set-area { display: block; margin-top: 12px; font-size: 12px; color: var(--fg-dim); }
.set-area textarea {
  display: block; box-sizing: border-box; width: 100%; margin-top: 5px; padding: 7px 8px; resize: vertical;
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
.set-row { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--fg-dim); }
.set-row + .set-row { margin-top: 12px; }
#set-size { flex: 1; accent-color: var(--accent2); }
#set-size-v { width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; flex-shrink: 0; }
.swatch.sel { border-color: var(--fg); }
#set-color { width: 28px; height: 28px; border: none; background: none; padding: 0; cursor: pointer; }
#p-title { font-size: 16px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#p-seek { width: 100%; margin: 14px 0 2px; accent-color: var(--accent); height: 26px; }
#p-time { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
#p-ctrl { display: flex; align-items: center; justify-content: space-evenly; margin-top: 6px; }
#p-ctrl button { font-size: 26px; width: 54px; height: 54px; color: var(--fg); }
#p-ctrl .small { font-size: 13px; font-weight: 700; color: var(--fg-dim); }
#p-play {
  font-size: 30px !important; width: 68px !important; height: 68px !important;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 50%; color: #fff !important;
}

/* ── 자막 전체보기 ── */
#transcript {
  position: absolute; inset: 0; background: var(--bg); z-index: 5;
  display: none; flex-direction: column;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 0 calc(10px + var(--safe-b));
}
#transcript.open { display: flex; }
#tr-head { display: flex; align-items: center; padding: 0 14px 8px; }
#tr-head b { flex: 1; font-size: 15px; }
#tr-head button { font-size: 20px; width: 40px; height: 40px; }
#tr-list { flex: 1; overflow-y: auto; padding: 0 18px; }
.cue-line { padding: 9px 10px; border-radius: 10px; font-size: 15px; line-height: 1.55; color: var(--fg-dim); cursor: pointer; }
.cue-line .ts { font-size: 10px; color: var(--dim3); margin-right: 8px; font-variant-numeric: tabular-nums; }
.cue-line.cur { background: var(--bg3); color: var(--cue-color, #f9a8d4); }

.spin { text-align: center; color: var(--fg-dim); padding: 40px; grid-column: 1/-1; }

/* ── 가로 화면: 플레이어 좌우 분할, 상세 히어로 높이 제한 ── */
@media (orientation: landscape) {
  #detail .hero img, #detail .hero .cover-ph {
    aspect-ratio: auto; height: 44vh; width: 100%; object-fit: cover;
  }
  #player {
    display: grid;
    grid-template-columns: minmax(0, 42%) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto auto;
    grid-template-areas:
      "top   top"
      "cover cue"
      "cover title"
      "cover seek"
      "cover time"
      "cover ctrl";
    column-gap: 18px;
  }
  #p-top { grid-area: top; }
  #p-cover-wrap { grid-area: cover; min-height: 0; }
  #p-cue { grid-area: cue; max-height: none; min-height: 0; overflow-y: auto; }
  #p-title { grid-area: title; }
  #p-seek { grid-area: seek; margin: 8px 0 2px; }
  #p-time { grid-area: time; }
  #p-ctrl { grid-area: ctrl; }
  /* 자막만 보기: 표지 열 없이 전체 폭 사용 */
  #player.mode-sub {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top" "cue";
  }
}
</style>
</head>
<body>

<div id="header">
  <div class="row">
    <h1><b>ASMR</b> 라이브러리</h1>
    <button id="setbtn" title="설정">⚙</button>
    <button id="favbtn" title="즐겨찾기만 보기">♥</button>
    <select id="sort">
      <option value="rj">번호순</option>
      <option value="added">최근 추가순</option>
    </select>
    <span id="count"></span>
  </div>
  <input id="search" type="search" placeholder="제목 · 서클 · 성우 · RJ코드 검색" autocomplete="off">
</div>

<div id="resume"></div>

<div id="library"><div class="spin">불러오는 중…</div></div>

<div id="detail">
  <button id="d-back">←</button>
  <button id="d-fav">♡</button>
  <div class="hero" id="d-hero"></div>
  <div id="d-body">
    <h2 id="d-title"></h2>
    <div id="d-orig"></div>
    <div id="d-sub"></div>
    <div id="d-tags"></div>
    <div id="d-listhead"><span id="d-count"></span><button id="d-folders">폴더 구조</button></div>
    <div id="d-tracks"></div>
  </div>
</div>

<div id="mini">
  <div id="mini-bar"><div></div></div>
  <div class="inner" id="mini-open">
    <span id="mini-cover"></span>
    <div class="tt">
      <div class="n" id="mini-title"></div>
      <div class="cue" id="mini-cue"></div>
    </div>
    <button id="mini-play">▶</button>
    <button id="mini-next">⏭</button>
  </div>
</div>

<div id="player">
  <div id="p-top">
    <button id="p-close">▾</button>
    <div id="p-work"></div>
    <button id="p-full" class="topbtn" title="몰입 모드">⛶</button>
    <button id="p-aa" class="topbtn" title="자막 설정">Aa</button>
    <button id="p-mode" class="topbtn" title="보기 모드"></button>
    <button id="p-tr" title="자막 전체보기">≡</button>
  </div>

  <div id="p-cover-wrap"><span id="p-cover"></span></div>
  <div id="p-title"></div>
  <div id="p-cue" class="none">자막 없음</div>
  <input id="p-seek" type="range" min="0" max="1000" value="0">
  <div id="p-time"><span id="p-cur">0:00</span><span id="p-dur">0:00</span></div>
  <div id="p-ctrl">
    <button class="small" id="p-speed">1.0×</button>
    <button id="p-prev">⏮</button>
    <button id="p-back10">↺</button>
    <button id="p-play">▶</button>
    <button id="p-fwd10">↻</button>
    <button id="p-next">⏭</button>
    <button class="small" id="p-loop">연속</button>
  </div>

  <div id="transcript">
    <div id="tr-head"><b>자막</b><button id="tr-close">✕</button></div>
    <div id="tr-list"></div>
  </div>
</div>

<div id="viewer">
  <button id="v-close">✕</button>
  <div id="v-body"></div>
</div>

<div id="p-settings">
  <div class="set-row">테마
    <div id="set-themes">
      <button data-t="dark" title="다크">다크</button>
      <button data-t="black" title="OLED 검정">검정</button>
      <button data-t="light" title="라이트">라이트</button>
    </div>
  </div>
  <div class="set-sep"></div>
  <div class="set-row">자막 크기 <input id="set-size" type="range" min="12" max="44" step="1"><span id="set-size-v"></span></div>
  <div class="set-row" id="set-swatches">자막 색
    <button class="swatch" data-c="#f9a8d4" style="background:#f9a8d4"></button>
    <button class="swatch" data-c="#e2e8f0" style="background:#e2e8f0"></button>
    <button class="swatch" data-c="#fde047" style="background:#fde047"></button>
    <button class="swatch" data-c="#86efac" style="background:#86efac"></button>
    <button class="swatch" data-c="#7dd3fc" style="background:#7dd3fc"></button>
    <input id="set-color" type="color" title="직접 선택">
  </div>
  <div class="set-sep"></div>
  <label class="set-area">번역 지시
    <textarea id="set-style" rows="3" disabled spellcheck="false" placeholder="예: 화자는 주인공의 여자친구. 반말을 쓴다"></textarea>
  </label>
  <label class="set-area">용어집 (한 줄에 하나, 원어 = 번역어)
    <textarea id="set-glossary" rows="3" disabled spellcheck="false" placeholder="お兄ちゃん = 오빠"></textarea>
  </label>
  <label class="set-area">교정 치환 (번역 결과에서 찾아 바꾸기, 오역 = 수정)
    <textarea id="set-corrections" rows="3" disabled spellcheck="false" placeholder="오역된 단어 = 수정된 단어"></textarea>
  </label>
</div>

<div id="fail">
  <div id="fail-head"><span id="fail-n"></span><button id="fail-more">자세히</button><button id="fail-ok">확인</button></div>
  <div id="fail-list"></div>
</div>

<div id="toast"></div>

<audio id="audio" preload="metadata"></audio>

<script>
"use strict";
const $ = id => document.getElementById(id);
const audio = $("audio");
const enc = p => p.split("/").map(encodeURIComponent).join("/");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t => {
  if (!isFinite(t)) return "0:00";
  t = Math.floor(t);
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0");
};

// 서버가 자막 본문으로 판별한 언어 기준
const ccBadge = t => t.srt ? `<span class="cc${t.srtLang === "ko" ? " ko" : ""}">${t.srtLang === "ko" ? "KO" : "CC"}</span>` : "";

let works = [];            // 전체 작품
let curWork = null;        // 상세 화면에 표시 중인 작품
let playWork = null;       // 재생 중인 작품
let queue = [], curIdx = -1;

const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
};
let favs = new Set(store.get("favs", []));          // 즐겨찾기 작품 id
let doneTracks = store.get("doneTracks", {});       // 끝까지 들은 트랙 path
let lastPlayed = store.get("lastPlayed", null);     // 이어 듣기 정보
let favOnly = localStorage.getItem("favOnly") === "1";
let cues = [], activeKey = "", loadedSrt = null;
let seeking = false;
const SPEEDS = [1.0, 1.2, 1.5, 2.0, 0.8];
let speedIdx = 0;
let autoNext = localStorage.getItem("autoNext") !== "0";

/* ───── 라이브러리 ───── */
async function loadWorks() {
  works = await (await fetch("/api/works")).json();
  renderLibrary();
  backfillMeta();
}

function coverHtml(w, cls) {
  if (w.hasCover)
    return `<img loading="lazy" src="/api/cover/${enc(w.id)}" onerror="this.replaceWith(phEl('${esc(w.rj||w.id).slice(0,2)}'))" alt="">`;
  return `<div class="cover-ph">${esc((w.rj || w.id).slice(0, 4))}</div>`;
}
window.phEl = txt => { const d = document.createElement("div"); d.className = "cover-ph"; d.textContent = txt; return d; };

let sortMode = localStorage.getItem("sort") || "rj";

function renderLibrary() {
  const q = $("search").value.trim().toLowerCase();
  const list = works.filter(w => !q ||
    [w.title, w.titleOrig, w.circle, w.rj, ...(w.cvs||[]), ...(w.genres||[])].join(" ").toLowerCase().includes(q));
  const rjNum = w => w.rj ? +w.rj.slice(2) : Infinity;
  if (sortMode === "added") list.sort((a, b) => (b.added || 0) - (a.added || 0));
  else list.sort((a, b) => rjNum(a) - rjNum(b) || (a.id > b.id ? 1 : -1));
  const shown = favOnly ? list.filter(w => favs.has(w.id)) : list;
  $("count").textContent = `${shown.length}개 작품`;
  if (!works.length) {
    $("library").innerHTML = `<div id="empty">작품이 없습니다.<br>
      DLsite에서 다운로드한 작품 폴더를<br><code>works\\</code> 폴더에 넣고 새로고침하세요.<br><br>
      폴더명에 RJ코드가 있으면 표지·태그를 자동으로 가져옵니다.</div>`;
    return;
  }
  $("library").innerHTML = shown.map(w => {
    const hasSub = w.tracks.some(t => t.srt);
    const done = w.tracks.filter(t => doneTracks[t.path]).length;
    return `<div class="card" data-id="${esc(w.id)}">
      <div class="cover-box">${coverHtml(w)}
        ${w.rj ? `<span class="badge">${esc(w.rj)}</span>` : ""}
        ${hasSub ? `<span class="badge sub">자막</span>` : ""}
        ${favs.has(w.id) ? `<span class="fav-mark">♥</span>` : ""}
        ${done ? `<div class="prog"><div style="width:${(done / w.tracks.length * 100).toFixed(0)}%"></div></div>` : ""}
      </div>
      <div class="info"><div class="t">${esc(w.title)}</div>
      <div class="c">${esc(w.circle || "")}${done ? ` · ${done}/${w.tracks.length} 들음` : ""}</div></div>
    </div>`;
  }).join("") || `<div id="empty">${favOnly ? "즐겨찾기한 작품이 없습니다" : "검색 결과 없음"}</div>`;
  document.querySelectorAll(".card").forEach(el =>
    el.onclick = () => openWork(works.find(w => w.id === el.dataset.id)));
  renderResume();
}

/* ───── 이어 듣기 카드 ───── */
function renderResume() {
  const box = $("resume");
  const w = lastPlayed && works.find(x => x.id === lastPlayed.workId);
  const path = lastPlayed && lastPlayed.paths && lastPlayed.paths[lastPlayed.idx];
  const t = w && w.tracks.find(x => x.path === path);
  if (!t) { box.innerHTML = ""; return; }
  const pos = +localStorage.getItem("pos:" + t.path) || 0;
  box.innerHTML = `<div id="resume-card">${coverHtml(w)}
    <div class="rt"><div class="a">이어 듣기</div><div class="b">${esc(t.name)} — ${esc(w.title)}</div></div>
    <span class="tm">${fmt(pos)}${lastPlayed.dur ? " / " + fmt(lastPlayed.dur) : ""}</span></div>`;
  $("resume-card").onclick = () => {
    const tracks = lastPlayed.paths.map(p => w.tracks.find(x => x.path === p)).filter(Boolean);
    if (tracks.length) playTrack(w, Math.min(lastPlayed.idx, tracks.length - 1), true, tracks);
  };
}

$("favbtn").classList.toggle("on", favOnly);
$("favbtn").onclick = () => {
  favOnly = !favOnly;
  localStorage.setItem("favOnly", favOnly ? "1" : "0");
  $("favbtn").classList.toggle("on", favOnly);
  renderLibrary();
};

// 메타데이터가 없거나 제목 번역만 실패한 작품을 백그라운드에서 순차 조회
async function backfillMeta() {
  for (const w of works) {
    if (!w.rj || (w.hasMeta && !w.titlePending)) continue;
    try {
      const m = await (await fetch(`/api/meta/${w.rj}`)).json();
      if (m.notfound) { w.hasMeta = true; continue; }
      Object.assign(w, { title: m.title || w.title, titleOrig: m.title_orig, circle: m.circle,
                         genres: m.genres, cvs: m.cvs, date: m.date, hasMeta: true,
                         titlePending: !!m.title_pending,
                         hasCover: w.hasCover || !!m.image });
    } catch (e) { /* 오프라인이면 폴더명으로 표시 */ }
  }
  renderLibrary();
  if (curWork) fillDetail(curWork);
}

$("search").oninput = renderLibrary;
$("sort").value = sortMode;
$("sort").onchange = () => {
  sortMode = $("sort").value;
  localStorage.setItem("sort", sortMode);
  renderLibrary();
};

/* ───── 상세 ───── */
function openWork(w) {
  curWork = w;
  expPath = localStorage.getItem("exp:" + w.id) || "";  // 탐색 위치 기억
  fillDetail(w);
  $("detail").classList.add("open");
  history.pushState({ v: "detail" }, "");
}
function fillDetail(w) {
  $("d-hero").innerHTML = coverHtml(w);
  $("d-title").textContent = w.title;
  $("d-orig").textContent = w.titleOrig && w.titleOrig !== w.title ? w.titleOrig : "";
  $("d-sub").innerHTML = `${w.rj ? `<span class="rj">${esc(w.rj)}</span> · ` : ""}${esc(w.circle || "")}${w.date ? " · " + esc(w.date.slice(0,10)) : ""}`;
  $("d-fav").textContent = favs.has(w.id) ? "♥" : "♡";
  $("d-fav").classList.toggle("on", favs.has(w.id));
  $("d-tags").innerHTML =
    (w.cvs||[]).map(c => `<span class="cv" data-q="${esc(c)}">CV ${esc(c)}</span>`).join("") +
    (w.genres||[]).map(g => `<span data-q="${esc(g)}">${esc(g)}</span>`).join("");
  // 태그 탭 → 그 태그로 라이브러리 필터
  document.querySelectorAll("#d-tags span").forEach(el =>
    el.onclick = () => {
      $("search").value = el.dataset.q;
      renderLibrary();
      history.back();
      window.scrollTo(0, 0);
    });
  renderTracks(w);
}

/* 트랙 보기: 목록(평면) / 폴더 그룹 / 탐색(폴더 단위 이동) */
const TRACK_VIEWS = [["flat", "목록"], ["group", "폴더 그룹"], ["tree", "탐색"]];
let trackView = localStorage.getItem("trackView") ||
  (localStorage.getItem("showFolders") === "0" ? "flat" : "group");
let expPath = "";  // 탐색 모드의 현재 폴더

function renderTracks(w) {
  const hasFolders = w.tracks.some(t => t.folder) || (w.others || []).some(o => o.folder);
  $("d-count").textContent = `${w.tracks.length}개 트랙`;
  $("d-folders").style.display = hasFolders ? "" : "none";
  $("d-folders").textContent = (TRACK_VIEWS.find(v => v[0] === trackView) || TRACK_VIEWS[0])[1];
  $("d-folders").classList.toggle("on", trackView !== "flat");
  const view = hasFolders ? trackView : "flat";
  if (view === "tree") return renderTree(w);

  const grouped = view === "group";
  let html = "", last = null;
  w.tracks.forEach((t, i) => {
    if (grouped && t.folder !== last) {
      html += `<div class="folder-h">📁 ${esc(t.folder || "(루트)")}</div>`;
      last = t.folder;
    }
    html += trackRow(t, i, !grouped);
  });
  $("d-tracks").innerHTML = html;
  document.querySelectorAll(".track").forEach(el =>
    el.onclick = () => playTrack(w, +el.dataset.i, true));
  markPlaying();
}

function trackRow(t, i, showPath) {
  return `
    <div class="track" data-i="${i}">
      <span class="no">${i+1}</span>
      <div class="tn"><div class="n">${esc(t.name)}</div>${showPath && t.folder ? `<div class="f">${esc(t.folder)}</div>` : ""}</div>
      ${ccBadge(t)}
      <span class="sz">${(t.size/1048576).toFixed(0)}MB</span>
    </div>`;
}

function renderTree(w) {
  const items = [...w.tracks.map((t, i) => ({ ...t, kind: "audio", ti: i })), ...(w.others || [])];
  // 저장돼 있던 경로가 더 이상 존재하지 않으면(폴더명 변경 등) 루트로
  if (expPath && !items.some(it => { const f = it.folder || ""; return f === expPath || f.startsWith(expPath + "/"); }))
    expPath = "";
  localStorage.setItem("exp:" + w.id, expPath);
  const dirs = new Set(), files = [];
  const prefix = expPath ? expPath + "/" : "";
  for (const it of items) {
    const f = it.folder || "";
    if (f === expPath) files.push(it);
    else if (f.startsWith(prefix) && f.length > prefix.length) dirs.add(f.slice(prefix.length).split("/")[0]);
  }
  const nat = s => s.split(/(\d+)/).map(x => /^\d+$/.test(x) ? x.padStart(9, "0") : x.toLowerCase()).join("");
  files.sort((a, b) => nat(a.name) < nat(b.name) ? -1 : 1);

  let html = `<div id="crumb"><button id="exp-up" ${expPath ? "" : "disabled"}>↰</button><span>📂 /${esc(expPath)}</span></div>`;
  html += [...dirs].sort((a, b) => nat(a) < nat(b) ? -1 : 1).map(d =>
    `<div class="track dir" data-d="${esc(d)}"><span class="no">📁</span><div class="tn"><div class="n">${esc(d)}</div></div><span class="sz">›</span></div>`).join("");
  html += files.map(it => it.kind === "audio"
    ? `<div class="track" data-i="${it.ti}"><span class="no">▶</span><div class="tn"><div class="n">${esc(it.name)}</div></div>${ccBadge(it)}<span class="sz">${(it.size/1048576).toFixed(0)}MB</span></div>`
    : `<div class="track other" data-p="${esc(it.path)}" data-k="${it.kind}"><span class="no">${it.kind === "image" ? "🖼" : "📄"}</span><div class="tn"><div class="n">${esc(it.name)}</div></div></div>`).join("");
  $("d-tracks").innerHTML = html;

  const up = $("exp-up");
  if (up) up.onclick = () => { expPath = expPath.split("/").slice(0, -1).join("/"); renderTree(w); };
  document.querySelectorAll(".track.dir").forEach(el =>
    el.onclick = () => { expPath = expPath ? expPath + "/" + el.dataset.d : el.dataset.d; renderTree(w); });
  // 탐색 모드에서는 재생 큐를 현재 폴더의 오디오로 한정 (다음 방 스포일러 방지)
  const folderTracks = files.filter(f => f.kind === "audio");
  document.querySelectorAll(".track[data-i]").forEach(el =>
    el.onclick = () => playTrack(w, folderTracks.findIndex(f => f.ti === +el.dataset.i), true,
                                 folderTracks.map(f => w.tracks[f.ti])));
  document.querySelectorAll(".track.other").forEach(el =>
    el.onclick = () => openViewer(el.dataset.p, el.dataset.k));
  markPlaying();
}

$("d-folders").onclick = () => {
  const i = TRACK_VIEWS.findIndex(v => v[0] === trackView);
  trackView = TRACK_VIEWS[(i + 1) % TRACK_VIEWS.length][0];
  localStorage.setItem("trackView", trackView);
  if (curWork) renderTracks(curWork);
};

/* ───── 이미지·텍스트 뷰어 ───── */
function openViewer(path, kind) {
  if (kind === "file") { window.open("/api/audio/" + enc(path)); return; }
  $("v-body").innerHTML = kind === "image"
    ? `<img src="/api/audio/${enc(path)}" alt="">`
    : `<pre>불러오는 중…</pre>`;
  if (kind === "text")
    fetch("/api/srt/" + enc(path)).then(r => r.text())
      .then(t => $("v-body").innerHTML = `<pre>${esc(t)}</pre>`)
      .catch(() => $("v-body").innerHTML = `<pre>읽기 실패</pre>`);
  $("viewer").classList.add("open");
  history.pushState({ v: "viewer" }, "");
}
$("v-close").onclick = () => history.back();
function markPlaying() {
  const cur = queue[curIdx];
  document.querySelectorAll(".track[data-i]").forEach(el => {
    const t = curWork && curWork.tracks[+el.dataset.i];
    el.classList.toggle("playing", !!(cur && t && t.path === cur.path));
  });
}
$("d-back").onclick = () => history.back();
$("d-fav").onclick = () => {
  if (!curWork) return;
  favs.has(curWork.id) ? favs.delete(curWork.id) : favs.add(curWork.id);
  store.set("favs", [...favs]);
  $("d-fav").textContent = favs.has(curWork.id) ? "♥" : "♡";
  $("d-fav").classList.toggle("on", favs.has(curWork.id));
  renderLibrary();
};

/* ───── 재생 ───── */
function playTrack(w, i, openPlayer, q) {
  queue = q || w.tracks; curIdx = i; playWork = w;
  const t = queue[i];
  audio.src = "/api/audio/" + enc(t.path);
  audio.playbackRate = SPEEDS[speedIdx];
  const saved = +localStorage.getItem("pos:" + t.path) || 0;
  audio.currentTime = 0;
  audio.play().then(() => { if (saved > 5 && saved < (audio.duration || 1e9) - 10) audio.currentTime = saved; });
  loadSrt(t);
  $("mini").classList.add("on");
  $("mini-title").textContent = t.name;
  $("mini-cover").innerHTML = $("p-cover").innerHTML = coverHtml(w);
  $("p-work").textContent = t.name;    // 상단바: 모든 보기 모드에서 트랙명 노출
  $("p-title").textContent = t.name;
  markPlaying();
  setMediaSession(w, t);
  lastPlayed = { workId: w.id, paths: queue.map(x => x.path), idx: curIdx, dur: 0 };
  store.set("lastPlayed", lastPlayed);
  renderResume();
  if (openPlayer) showPlayer();
}

audio.onloadedmetadata = () => {
  if (lastPlayed && audio.duration) {
    lastPlayed.dur = audio.duration;
    store.set("lastPlayed", lastPlayed);
    renderResume();
  }
};
let toastTimer = null;
function showToast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2600);
}

const next = () => curIdx < queue.length - 1 && playTrack(playWork, curIdx + 1, false, queue);
const prev = () => curIdx > 0 && playTrack(playWork, curIdx - 1, false, queue);

audio.onended = () => {
  const t = queue[curIdx];
  if (t) {
    localStorage.removeItem("pos:" + t.path);
    doneTracks[t.path] = 1;          // 끝까지 들은 트랙 기록 → 카드 진행률
    store.set("doneTracks", doneTracks);
    renderLibrary();
  }
  if (autoNext) {
    const from = curIdx;
    next();
    if (curIdx !== from) showToast(queue[curIdx].name);  // 자동 전환만 알린다
  }
};
audio.onplay = audio.onpause = () => {
  const ic = audio.paused ? "▶" : "⏸";
  $("mini-play").textContent = ic; $("p-play").textContent = ic;
};
audio.ontimeupdate = () => {
  const d = audio.duration || 0, c = audio.currentTime;
  if (!seeking) $("p-seek").value = d ? c / d * 1000 : 0;
  $("mini-bar").firstElementChild.style.width = d ? c / d * 100 + "%" : 0;
  $("p-cur").textContent = fmt(c); $("p-dur").textContent = fmt(d);
  updateCue(c);
  if (Math.floor(c) % 5 === 0 && c > 5) localStorage.setItem("pos:" + queue[curIdx].path, c);
};

$("mini-play").onclick = e => { e.stopPropagation(); audio.paused ? audio.play() : audio.pause(); };
$("mini-next").onclick = e => { e.stopPropagation(); next(); };
$("mini-open").onclick = showPlayer;
$("p-play").onclick = () => audio.paused ? audio.play() : audio.pause();
$("p-next").onclick = next;
$("p-prev").onclick = prev;
$("p-back10").onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 10);
$("p-fwd10").onclick = () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
$("p-speed").onclick = () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  audio.playbackRate = SPEEDS[speedIdx];
  $("p-speed").textContent = SPEEDS[speedIdx].toFixed(1) + "×";
};
$("p-loop").onclick = () => {
  autoNext = !autoNext;
  localStorage.setItem("autoNext", autoNext ? "1" : "0");
  $("p-loop").style.color = autoNext ? "var(--accent2)" : "";
};
$("p-loop").style.color = autoNext ? "var(--accent2)" : "";
$("p-seek").oninput = () => { seeking = true; $("p-cur").textContent = fmt($("p-seek").value / 1000 * (audio.duration || 0)); };
$("p-seek").onchange = () => { audio.currentTime = $("p-seek").value / 1000 * (audio.duration || 0); seeking = false; };

function showPlayer() { $("player").classList.add("open"); history.pushState({ v: "player" }, ""); }
$("p-close").onclick = () => { closeSettings(); history.back(); };

/* ───── 보기 모드 (전체 / 표지+자막 / 자막만) ───── */
const MODES = [["full", "전체"], ["cover", "표지"], ["sub", "자막"]];
let modeIdx = Math.max(0, MODES.findIndex(m => m[0] === localStorage.getItem("viewMode")));
function applyMode() {
  MODES.forEach(m => $("player").classList.remove("mode-" + m[0]));
  $("player").classList.add("mode-" + MODES[modeIdx][0]);
  $("p-mode").textContent = MODES[modeIdx][1];
}
$("p-mode").onclick = () => {
  modeIdx = (modeIdx + 1) % MODES.length;
  localStorage.setItem("viewMode", MODES[modeIdx][0]);
  applyMode();
};
applyMode();
// 표지·자막 영역 탭 = 재생/일시정지 (미니멀 모드에서 컨트롤 없이 조작)
/* ───── 몰입 모드 ───── */
let immersive = false, peekTimer = null;

async function setImmersive(on) {
  immersive = on;
  document.body.classList.toggle("immersive", on);
  document.body.classList.remove("chrome-peek");
  clearTimeout(peekTimer);
  $("p-full").classList.toggle("on", on);
  // 실제 상태바·브라우저 크롬은 Fullscreen API 로만 사라진다.
  // 사용자 제스처 없이 부르면 거부되므로 실패는 그냥 삼킨다.
  try {
    if (on && !document.fullscreenElement)
      await document.documentElement.requestFullscreen({ navigationUI: "hide" });
    else if (!on && document.fullscreenElement)
      await document.exitFullscreen();
  } catch (e) { /* iOS Safari 등 미지원 — 앱 UI만 숨긴 채로 진행 */ }
}

// 몰입 중 화면을 누르면 상단바를 3초간 보여준다 (빠져나갈 수단)
function peekChrome() {
  document.body.classList.add("chrome-peek");
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => document.body.classList.remove("chrome-peek"), 3000);
}

$("p-full").onclick = () => setImmersive(!immersive);

// 시스템 뒤로가기·제스처로 전체화면이 풀리면 상태를 맞춘다
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && immersive) setImmersive(false);
});

$("p-cover-wrap").onclick = $("p-cue").onclick = () => {
  if (immersive) return peekChrome();
  audio.src && (audio.paused ? audio.play() : audio.pause());
};

/* ───── 자막 크기·색상 설정 ───── */
let cueSize = +localStorage.getItem("cueSize") || 16;
let cueColor = localStorage.getItem("cueColor") || "#f9a8d4";
function applyCueStyle() {
  document.documentElement.style.setProperty("--cue-size", cueSize + "px");
  document.documentElement.style.setProperty("--cue-color", cueColor);
  $("set-size").value = cueSize;
  $("set-size-v").textContent = cueSize;
  $("set-color").value = cueColor;
  document.querySelectorAll(".swatch").forEach(el =>
    el.classList.toggle("sel", el.dataset.c.toLowerCase() === cueColor.toLowerCase()));
  localStorage.setItem("cueSize", cueSize);
  localStorage.setItem("cueColor", cueColor);
}
/* ───── 테마 ───── */
const THEME_BG = { dark: "#0f1117", black: "#000000", light: "#f7f7fa" };
let theme = localStorage.getItem("theme") || "dark";
function applyTheme() {
  if (!THEME_BG[theme]) theme = "dark";
  // 기본값은 속성을 지워 :root 원본 정의를 그대로 쓴다
  if (theme === "dark") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  // 브라우저 모드에서 상태바 색을 테마에 맞춘다 (전체화면일 땐 무시됨)
  document.querySelector('meta[name="theme-color"]').setAttribute("content", THEME_BG[theme]);
  document.querySelectorAll("#set-themes button").forEach(b =>
    b.classList.toggle("sel", b.dataset.t === theme));
  localStorage.setItem("theme", theme);
}
document.querySelectorAll("#set-themes button").forEach(b =>
  b.onclick = () => { theme = b.dataset.t; applyTheme(); });
applyTheme();

const closeSettings = () => {
  $("p-settings").classList.remove("open");
  $("setbtn").classList.remove("on");
};
const toggleSettings = () => {
  const open = $("p-settings").classList.toggle("open");
  $("setbtn").classList.toggle("on", open);
  if (open) loadTranslateSettings();
};
const TRANSLATE_FIELDS = [["style", "set-style"], ["glossary", "set-glossary"], ["corrections", "set-corrections"]];
async function loadTranslateSettings() {
  try {
    const s = await (await fetch("/api/translate-settings")).json();
    for (const [k, id] of TRANSLATE_FIELDS) {
      if (document.activeElement !== $(id)) $(id).value = s[k];
      $(id).disabled = false;
    }
  } catch (e) { console.warn("번역 설정 로드 실패", e); }
}
async function saveTranslateSettings() {
  try {
    const r = await fetch("/api/translate-settings", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.fromEntries(TRANSLATE_FIELDS.map(([k, id]) => [k, $(id).value]))),
    });
    if (!r.ok) throw new Error(r.status);
    showToast("번역 설정을 저장했습니다");
  } catch (e) { showToast("번역 설정을 저장하지 못했습니다"); }
}
TRANSLATE_FIELDS.forEach(([, id]) => $(id).onchange = saveTranslateSettings);
$("p-aa").onclick = toggleSettings;
$("setbtn").onclick = toggleSettings;
// 패널 바깥을 누르면 닫기
document.addEventListener("click", e => {
  if (!$("p-settings").classList.contains("open")) return;
  if (e.target.closest("#p-settings, #setbtn, #p-aa")) return;
  closeSettings();
});
$("set-size").oninput = () => { cueSize = +$("set-size").value; applyCueStyle(); };
$("set-color").oninput = () => { cueColor = $("set-color").value; applyCueStyle(); };
document.querySelectorAll(".swatch").forEach(el =>
  el.onclick = () => { cueColor = el.dataset.c; applyCueStyle(); });
applyCueStyle();

/* 뒤로가기로 패널 닫기 */
window.onpopstate = () => {
  if ($("viewer").classList.contains("open")) $("viewer").classList.remove("open");
  else if ($("transcript").classList.contains("open")) $("transcript").classList.remove("open");
  else if ($("player").classList.contains("open")) {
    if (immersive) setImmersive(false);  // 라이브러리로 돌아갈 땐 헤더를 되살린다
    $("player").classList.remove("open");
  }
  else $("detail").classList.remove("open");
};

/* ───── SRT/VTT 자막 ───── */
async function loadSrt(t) {
  cues = []; activeKey = ""; loadedSrt = t.srt || null;
  $("p-cue").className = "none"; $("p-cue").textContent = "자막 없음";
  $("mini-cue").textContent = "";
  $("p-tr").classList.remove("on");
  renderTranscript();
  if (!t.srt) return;
  try {
    const text = await (await fetch("/api/srt/" + enc(t.srt))).text();
    if (loadedSrt !== t.srt) return;   // 그 사이 트랙이 바뀜
    cues = parseSrt(text);
    if (cues.length) {
      $("p-cue").textContent = "♪";
      $("p-tr").classList.add("on");
      renderTranscript();
    } else $("p-cue").textContent = "자막 없음";
  } catch (e) { console.warn("자막 로드 실패", e); }
}

function parseSrt(text) {
  // 줄 단위 파서: SRT / VTT / SRT 구조의 txt 모두 처리.
  // 빈 줄 구분이 없거나 인덱스 번호가 빠진 파일도 허용.
  const out = [];
  // 시간 형식: HH:MM:SS,mmm 또는 MM:SS.mmm (시 부분 생략 가능)
  const TIME = /(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[.,](\d{1,3})\s*-->\s*(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[.,](\d{1,3})/;
  let cur = null;
  const flush = () => {
    if (cur) {
      // 빈 줄 없이 다음 큐가 붙은 경우 말미의 인덱스 번호 제거
      while (cur.txt.length && /^\d+$/.test(cur.txt[cur.txt.length - 1])) cur.txt.pop();
      const txt = cur.txt.join("\n").trim();
      if (txt) out.push({ s: cur.s, e: cur.e, txt });
    }
    cur = null;
  };
  for (const raw of text.replace(/\r/g, "").split("\n")) {
    const line = raw.trim();
    if (line.includes("-->")) {
      const m = line.match(TIME);
      flush();
      if (m) cur = {
        s: (+m[1] || 0)*3600 + +m[2]*60 + +m[3] + +m[4].padEnd(3,"0")/1000,
        e: (+m[5] || 0)*3600 + +m[6]*60 + +m[7] + +m[8].padEnd(3,"0")/1000,
        txt: [],
      };
    } else if (!line) {
      // 텍스트가 이미 있으면 큐 종료. 타임코드와 텍스트 사이에 빈 줄이
      // 끼어 있는 변형 SRT는 큐를 유지한 채 계속 읽는다.
      if (cur && cur.txt.length) flush();
    } else if (cur) {
      cur.txt.push(line.replace(/<[^>]+>/g, ""));
    }
    // cur가 없을 때의 줄(WEBVTT 헤더, NOTE, 인덱스 번호 등)은 무시
  }
  flush();
  return out.sort((a, b) => a.s - b.s);
}

function updateCue(t) {
  if (!cues.length) return;
  // 현재 시각에 활성인 큐를 전부 수집 — 화자가 여럿이라 시간이 겹치면 위아래로 쌓아 표시.
  // 시작시간 정렬이므로 s > t 이후는 볼 필요 없음.
  const act = [];
  for (let i = 0; i < cues.length; i++) {
    if (cues[i].s > t) break;
    if (t < cues[i].e) act.push(i);
  }
  const key = act.join(",");
  if (key === activeKey) return;
  activeKey = key;
  $("p-cue").className = "";
  $("p-cue").innerHTML = act.map(i =>
    `<div class="cline">${esc(cues[i].txt).replace(/\n/g, "<br>")}</div>`).join("");
  $("mini-cue").textContent = act.map(i => cues[i].txt.replace(/\n/g, " ")).join("  ∥  ");
  document.querySelectorAll(".cue-line.cur").forEach(el => el.classList.remove("cur"));
  act.forEach(i => { const el = $("tr-list").children[i]; if (el) el.classList.add("cur"); });
  if (act.length && $("transcript").classList.contains("open")) {
    const el = $("tr-list").children[act[0]];
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

function renderTranscript() {
  $("tr-list").innerHTML = cues.length
    ? cues.map((c, i) => `<div class="cue-line" data-i="${i}"><span class="ts">${fmt(c.s)}</span>${esc(c.txt)}</div>`).join("")
    : `<div class="spin">이 트랙에는 자막이 없습니다</div>`;
  document.querySelectorAll(".cue-line").forEach(el =>
    el.onclick = () => { audio.currentTime = cues[+el.dataset.i].s; audio.play(); });
}
$("p-tr").onclick = () => {
  closeSettings();
  $("transcript").classList.add("open");
  history.pushState({ v: "tr" }, "");
  const el = document.querySelector(".cue-line.cur");
  if (el) el.scrollIntoView({ block: "center" });
};
$("tr-close").onclick = () => history.back();

/* ───── 잠금화면 컨트롤 ───── */
function setMediaSession(w, t) {
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.name, artist: w.circle || "", album: w.title,
    artwork: w.hasCover ? [{ src: "/api/cover/" + enc(w.id), sizes: "512x512" }] : [],
  });
  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("previoustrack", prev);
  navigator.mediaSession.setActionHandler("nexttrack", next);
  navigator.mediaSession.setActionHandler("seekbackward", () => audio.currentTime -= 10);
  navigator.mediaSession.setActionHandler("seekforward", () => audio.currentTime += 10);
}

/* ───── 자막 자동 생성 실패 알림 ───── */
function renderFailures(list) {
  $("fail").classList.toggle("on", list.length > 0);
  if (!list.length) { $("fail").classList.remove("open"); $("fail-more").textContent = "자세히"; return; }
  const errors = list.filter(f => f.kind === "error").length;
  $("fail-n").textContent = `⚠ 자막 ${errors ? `실패 ${errors}건` : ""}${errors && errors < list.length ? " · " : ""}` +
    `${errors < list.length ? `확인 필요 ${list.length - errors}건` : ""}`;
  $("fail-list").innerHTML = [...list].reverse().map(f =>
    `<div class="fail-i"><b>${esc(f.path || "자동 생성")}</b>${esc(f.msg)}${f.count > 1 ? ` (${f.count}회)` : ""}</div>`).join("");
}
async function checkFailures(method) {
  try { renderFailures(await (await fetch("/api/subgen/failures", { method })).json()); }
  catch (e) { /* 서버가 꺼져 있으면 다음 확인 때 다시 본다 */ }
}
$("fail-more").onclick = () => {
  $("fail-more").textContent = $("fail").classList.toggle("open") ? "접기" : "자세히";
};
$("fail-ok").onclick = () => checkFailures("DELETE");
setInterval(checkFailures, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkFailures(); });
checkFailures();

// 서버가 파일·폴더 이름을 한글로 바꾸면 경로로 저장한 기록도 새 경로로 옮긴다
async function applyRenames() {
  try {
    const { files, works: moved } = await (await fetch("/api/renames")).json();
    const to = p => files[p] || p;
    for (const [p, q] of Object.entries(files)) {
      const pos = localStorage.getItem("pos:" + p);
      if (pos !== null) { localStorage.setItem("pos:" + q, pos); localStorage.removeItem("pos:" + p); }
    }
    if (Object.keys(doneTracks).some(p => files[p])) {
      doneTracks = Object.fromEntries(Object.entries(doneTracks).map(([p, v]) => [to(p), v]));
      store.set("doneTracks", doneTracks);
    }
    if (lastPlayed && (lastPlayed.paths || []).some(p => files[p]) || lastPlayed && moved[lastPlayed.workId]) {
      lastPlayed.paths = (lastPlayed.paths || []).map(to);
      lastPlayed.workId = moved[lastPlayed.workId] || lastPlayed.workId;
      store.set("lastPlayed", lastPlayed);
    }
    if ([...favs].some(id => moved[id])) {
      favs = new Set([...favs].map(id => moved[id] || id));
      store.set("favs", [...favs]);
    }
  } catch (e) { console.warn("이름 변경 기록 반영 실패", e); }
}

applyRenames().finally(loadWorks);
</script>
